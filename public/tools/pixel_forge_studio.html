// ─── HELPERS ─────────────────────────────────────────────────────────────────
const hexToRgb = h => ({r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)});
const rgbToHex = (r,g,b) => '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rgb2hsv = (r,g,b) => { r/=255; g/=255; b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0; if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; } h*=60; if(h<0)h+=360; return [h, mx?d/mx:0, mx]; };
const hsv2rgb = (h,s,v) => { h/=360; const i=Math.floor(h*6), f=h*6-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s); let r,g,b; if(i%6===0){r=v;g=t;b=p}else if(i%6===1){r=q;g=v;b=p}else if(i%6===2){r=p;g=v;b=t}else if(i%6===3){r=p;g=q;b=v}else if(i%6===4){r=t;g=p;b=v}else{r=v;g=p;b=q} return [Math.round(r*255),Math.round(g*255),Math.round(b*255)]; };
const shadeColor = (hex, dl) => { const {r,g,b}=hexToRgb(hex); const [h,s,v]=rgb2hsv(r,g,b); return rgbToHex(...hsv2rgb(h,s,clamp(v+dl,0,1))); };

// ─── COMPLETE SPECTRUM PALETTE GENERATOR ─────────────────────────────────
function hslToRgb(h, s, l) {
    s/=100; l/=100;
    const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2;
    let r,g,b;
    if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x
    }else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
    return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)];
}
function genRamp(hue, sat, steps, minL=6, maxL=92) {
    const cols=[];
    for(let i=0;i<steps;i++) {
        const l = minL + (maxL-minL) * i / Math.max(1,steps-1);
        const [r,g,b] = hslToRgb(hue, sat, l);
        cols.push(rgbToHex(r,g,b));
    }
    return cols;
}
function buildPal(name, ramps) {
    const cols=[];
    for(const r of ramps) cols.push(...genRamp(r[0],r[1],r[2],r[3]||6,r[4]||92));
    return cols;
}

// ─── SHAPE DRAWING ────────────────────────────────────────────────────────────
function drawShape(ctx, x1, y1, x2, y2, tool, color, brushSize) {
    const bw = Math.max(1, Math.floor(brushSize));
    const half = Math.floor(bw/2);
    ctx.fillStyle = color;
    switch(tool) {
        case 'line': {
            const dx=Math.abs(x2-x1), dy=Math.abs(y2-y1);
            const sx=x1<x2?1:-1, sy=y1<y2?1:-1;
            let err=dx-dy;
            while(true) {
                ctx.fillRect(x1-half, y1-half, bw, bw);
                if(x1===x2 && y1===y2) break;
                const e2=2*err;
                if(e2>-dy) { err-=dy; x1+=sx; }
                if(e2<dx) { err+=dx; y1+=sy; }
            }
            break;
        }
        case 'rect': {
            const mx=Math.min(x1,x2), Mx=Math.max(x1,x2);
            const my=Math.min(y1,y2), My=Math.max(y1,y2);
            for(let x=mx; x<=Mx; x++) for(let y=my; y<=My; y++) ctx.fillRect(x,y,1,1);
            break;
        }
        case 'rect_outline': {
            const mx=Math.min(x1,x2), Mx=Math.max(x1,x2);
            const my=Math.min(y1,y2), My=Math.max(y1,y2);
            ctx.fillStyle = color;
            ctx.fillRect(mx, my, Mx-mx+1, My-my+1);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(mx+1, my+1, Mx-mx-1, My-my-1);
            ctx.globalCompositeOperation = 'source-over';
            break;
        }
        case 'circle': {
            const cx=(x1+x2)/2, cy=(y1+y2)/2, rx=Math.abs(x2-x1)/2, ry=Math.abs(y2-y1)/2;
            for(let x=Math.floor(cx-rx); x<=Math.ceil(cx+rx); x++) {
                for(let y=Math.floor(cy-ry); y<=Math.ceil(cy+ry); y++) {
                    if(((x-cx)/rx)**2+((y-cy)/ry)**2<=1) ctx.fillRect(x,y,1,1);
                }
            }
            break;
        }
        case 'circle_outline': {
            const cx=(x1+x2)/2, cy=(y1+y2)/2, rx=Math.abs(x2-x1)/2, ry=Math.abs(y2-y1)/2;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.ellipse(cx, cy, Math.max(0, rx-1), Math.max(0, ry-1), 0, 0, Math.PI*2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            break;
        }
        case 'fill': {
            const w=ctx.canvas.width, h=ctx.canvas.height;
            const d=ctx.getImageData(0,0,w,h);
            const src=d.data;
            const idx=(y1*w+x1)*4;
            const tr=src[idx], tg=src[idx+1], tb=src[idx+2], ta=src[idx+3];
            const cr=parseInt(color.slice(1,3),16), cg=parseInt(color.slice(3,5),16), cb=parseInt(color.slice(5,7),16);
            if(tr===cr&&tg===cg&&tb===cb) return;
            const stack=[[x1,y1]];
            const visited=new Uint8Array(w*h);
            while(stack.length) {
                const [px,py]=stack.pop();
                if(px<0||px>=w||py<0||py>=h) continue;
                const i=(py*w+px);
                if(visited[i]) continue;
                visited[i]=1;
                const di=i*4;
                if(src[di]===tr&&src[di+1]===tg&&src[di+2]===tb) {
                    src[di]=cr; src[di+1]=cg; src[di+2]=cb; src[di+3]=255;
                    stack.push([px-1,py],[px+1,py],[px,py-1],[px,py+1]);
                }
            }
            ctx.putImageData(d,0,0);
            break;
        }
    }
}

                        }
                    }
                }
            }
        } else if (tool === 'eraser') {
            const half = Math.floor(bw/2);
            for (let dx=-half; dx<=half; dx++) for (let dy=-half; dy<=half; dy++) {
                ctx.clearRect(p.x+dx, p.y+dy, 1, 1);
            }
        } else if (tool === 'effect') {
            applyEffectAt(p.x, p.y);
        }
    };

    // ─── Effect brush (ported from the Editor) ───
    const rgb2hsv=(r,g,b)=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}const s=mx?d/mx:0;return [h,s,mx];};
    const hsv2rgb=(h,s,v)=>{const i=Math.floor(h*6),f=h*6-i;const p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);let r,g,b;switch(i%6){case 0:r=v,g=t,b=p;break;case 1:r=q,g=v,b=p;break;case 2:r=p,g=v,b=t;break;case 3:r=p,g=q,b=v;break;case 4:r=t,g=p,b=v;break;default:r=v,g=p,b=q;}return [Math.round(r*255),Math.round(g*255),Math.round(b*255)];};

    const applyEffectAt=(x,y)=>{
        const c=canvasRef.current; if(!c)return;
        const ctx=c.getContext('2d',{willReadFrequently:true});
        const W=c.width,H=c.height;
        const bw=Math.max(1,brushSize|0);
        const half=Math.floor(bw/2);
        const opaque=(xx,yy)=>{ if(xx<0||yy<0||xx>=W||yy>=H)return false; const dd=ctx.getImageData(xx,yy,1,1).data; return dd[3]>0; };
        for(let dx=-half;dx<=half;dx++)for(let dy=-half;dy<=half;dy++){
            if(dx*dx+dy*dy>half*half)continue;
            const px=x+dx,py=y+dy;
            if(px<0||py<0||px>=W||py>=H)continue;
            const d=ctx.getImageData(px,py,1,1).data;
            if(d[3]===0)continue;
            let r=d[0],g=d[1],b=d[2],a=d[3];
            if(effectType==='hue'){const hsv=rgb2hsv(r,g,b);hsv[0]=(hsv[0]+hueShift/360)%1;if(hsv[0]<0)hsv[0]+=1;const cc=hsv2rgb(hsv[0],hsv[1],hsv[2]);r=cc[0];g=cc[1];b=cc[2];}
            else if(effectType==='bright'){const f=1+hueShift/100;r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));}
            else if(effectType==='desat'){const av=Math.round((r+g+b)/3);r=g=b=av;}
            else if(effectType==='invert'){r=255-r;g=255-g;b=255-b;}
            else if(effectType==='highlight'){const hsv=rgb2hsv(r,g,b);let h=hsv[0]+(hsv[1]>0.05?(effectSpread/360):0);if(h>=1)h-=1;const cc=hsv2rgb(h,hsv[1],Math.min(1,hsv[2]+effectStrength));r=cc[0];g=cc[1];b=cc[2];}
            else if(effectType==='shadow'){const hsv=rgb2hsv(r,g,b);let h=hsv[0]-(hsv[1]>0.05?(effectSpread/360):0);if(h<0)h+=1;const cc=hsv2rgb(h,hsv[1],Math.max(0,hsv[2]-effectStrength));r=cc[0];g=cc[1];b=cc[2];}
            else if(effectType==='outline'){const isEdge=opaque(px,py)&&!(opaque(px-1,py)&&opaque(px+1,py)&&opaque(px,py-1)&&opaque(px,py+1));if(!isEdge){a=0;}}
            ctx.putImageData(new ImageData(new Uint8ClampedArray([r,g,b,a]),1,1),px,py);
        }
    };

    const handleDown = (e) => {
        if (e.touches) e.preventDefault();
        const p = getPos(e);
        if (!p) return;
        if (e.button === 2 || e.button === 1) { // right / middle click = erase
            const ctx = canvasRef.current.getContext('2d', { willReadFrequently: true });
            saveUndo();
            for (let dx=0; dx<brushSize; dx++) for (let dy=0; dy<brushSize; dy++) ctx.clearRect(p.x+dx, p.y+dy, 1, 1);
            setIsDrawing(false);
            return;
        }
        if (tool === 'eyedropper') {
            const ctx = canvasRef.current.getContext('2d', { willReadFrequently: true });
            const px = ctx.getImageData(p.x, p.y, 1, 1).data;
            if (px[3] > 0) logColor(rgbToHex(px[0], px[1], px[2]));
            return;
        }
        if (['line','rect','rect_outline','circle','circle_outline','fill'].includes(tool)) {
            saveUndo();
            setDrawOrigin(p);
            setIsDrawing(true);
            if (tool === 'fill') {
                drawShape(ctx=canvasRef.current.getContext('2d'), p.x, p.y, p.x, p.y, tool, selectedColor, brushSize);
                setIsDrawing(false);
            }
            return;
        }
        saveUndo();
        setIsDrawing(true);
        drawAt(p);
    };

    const handleMove = (e) => {
        if (e.touches) e.preventDefault();
        const p = getPos(e);
        if (!p) return;
        if(cursorStyle!=='none') setCursorPos(p);
        if (isDrawing && ['line','rect','rect_outline','circle','circle_outline'].includes(tool) && drawOrigin) {
            const c = canvasRef.current;
            const ctx = c.getContext('2d');
            // Restore from undo state (last in stack)
            if (undoStack.length) ctx.putImageData(undoStack[undoStack.length-1], 0, 0);
            drawShape(ctx, drawOrigin.x, drawOrigin.y, p.x, p.y, tool, selectedColor, brushSize);
            return;
        }
        if (isDrawing) drawAt(p);
    };

    const handleUp = (e) => { if (e && e.touches) e.preventDefault(); setIsDrawing(false); setDrawOrigin(null); };

    // ─── Palette selection ────────────────────────────────────────────────
    const selectPalette = (name) => {
        const colors = FLAT_PALETTES[name];
        if (!colors) return;
        setPalette(colors);
        if (colors.length) pickColor(colors[0]);
    };

    // ─── Export ────────────────────────────────────────────────────────────
    const handleExport = () => {
        const c = canvasRef.current;
        if (!c || frames.length === 0) return;
        const scale = Number(exportScale);

        if (exportFormat === 'gif' && frames.length > 1) {
            exportGIF(scale);
            return;
        }
        if (exportFormat === 'spritesheet' || frames.length === 1) {
            exportSpritesheet(scale);
            return;
        }
        exportPNG(scale);
    };

    const exportPNG = (scale) => {
        const c = canvasRef.current;
        saveFrameState();
        const exp = document.createElement('canvas');
        exp.width = c.width * scale;
        exp.height = c.height * scale;
        const ctx = exp.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(c, 0, 0, exp.width, exp.height);
        download(exp.toDataURL('image/png'), saveName+'.png');
        try{ parent.postMessage({type:'ADD_TO_HUB', dataURL: exp.toDataURL('image/png'), name: saveName+'.png'}, '*'); }catch(e){}
        setShowSave(false);
    };

    const exportSpritesheet = (scale) => {
        const cols = Math.ceil(Math.sqrt(frames.length));
        const rows = Math.ceil(frames.length / cols);
        const fw = canvasRef.current.width;
        const fh = canvasRef.current.height;
        const exp = document.createElement('canvas');
        exp.width = fw * cols * scale;
        exp.height = fh * rows * scale;
        const ctx = exp.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        for (let i=0; i<frames.length; i++) {
            const fx = (i % cols) * fw * scale;
            const fy = Math.floor(i / cols) * fh * scale;
            const tmp = document.createElement('canvas');
            tmp.width = fw; tmp.height = fh;
            tmp.getContext('2d').putImageData(frames[i], 0, 0);
            ctx.drawImage(tmp, fx, fy, fw*scale, fh*scale);
        }
        download(exp.toDataURL('image/png'), saveName+'_spritesheet.png');
        try{ parent.postMessage({type:'ADD_TO_HUB', dataURL: exp.toDataURL('image/png'), name: saveName+'_spritesheet.png'}, '*'); }catch(e){}
        setShowSave(false);
    };

    const exportGIF = (scale) => {
        // Use gif.js via CDN
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js';
        script.onload = () => {
            const fw = canvasRef.current.width;
            const fh = canvasRef.current.height;
            const gif = new GIF({ workers: 2, quality: 10, width: fw*scale, height: fh*scale });
            for (let i=0; i<frames.length; i++) {
                const tmp = document.createElement('canvas');
                tmp.width = fw*scale; tmp.height = fh*scale;
                const tCtx = tmp.getContext('2d');
                tCtx.imageSmoothingEnabled = false;
                const src = document.createElement('canvas');
                src.width = fw; src.height = fh;
                src.getContext('2d').putImageData(frames[i], 0, 0);
                tCtx.drawImage(src, 0, 0, fw*scale, fh*scale);
                gif.addFrame(tmp, { delay: frameDurations[i] || 100 });
            }
            gif.on('finished', (blob) => {
                download(URL.createObjectURL(blob), saveName+'.gif');
                const reader = new FileReader();
                reader.onloadend = function() {
                    try{ parent.postMessage({type:'ADD_TO_HUB', dataURL: reader.result, name: saveName+'.gif'}, '*'); }catch(e){}
                };
                reader.readAsDataURL(blob);
            });
            gif.render();
        };
        document.body.appendChild(script);
        setShowSave(false);
    };

    const download = (url, name) => {
        if(parent.window.__tauriSave) {
            const ext = name.split('.').pop() || 'png';
            parent.window.__tauriSave(url, name, ext);
        }
    };

    // ─── Clear helpers ────────────────────────────────────────────────────
    const clearCanvas = () => {
        saveUndo();
        const c = canvasRef.current;
        c.getContext('2d').fillStyle = '#000';
        c.getContext('2d').fillRect(0,0,c.width,c.height);
        saveFrameState();
    };

    const undo = () => {
        if (!undoStack.length) return;
        const c = canvasRef.current;
        const ctx = c.getContext('2d');
        const cur = ctx.getImageData(0,0,c.width,c.height);
        const prev = undoStack[undoStack.length-1];
        setUndoStack(prev.slice(0,-1));
        setRedoStack(r => [...r.slice(-29), cur]);
        ctx.putImageData(prev,0,0);
    };

    const redo = () => {
        if (!redoStack.length) return;
        const c = canvasRef.current;
        const ctx = c.getContext('2d');
        const cur = ctx.getImageData(0,0,c.width,c.height);
        const next = redoStack[redoStack.length-1];
        setRedoStack(r => r.slice(0,-1));
        setUndoStack(u => [...u.slice(-29), cur]);
        ctx.putImageData(next,0,0);
    };

    // Send undo/redo status to parent (top bar buttons)
    useEffect(()=>{
        try{ parent.postMessage({type:'UNDO_STATUS',canUndo:undoStack.length>0,canRedo:redoStack.length>0},'*'); }catch(e){}
    },[undoStack,redoStack]);

    // Listen for UNDO/REDO from parent (top bar buttons)
    useEffect(()=>{
        const h=(e)=>{ const d=e.data||{}; if(d.type==='UNDO') undo(); if(d.type==='REDO') redo(); };
        window.addEventListener('message',h);
        return ()=>window.removeEventListener('message',h);
    },[undo,redo]);


    const addFrameFromCanvas = (srcCanvas) => {
        const c = canvasRef.current;
        const nc = document.createElement('canvas');
        nc.width = c.width; nc.height = c.height;
        nc.getContext('2d').drawImage(srcCanvas, 0, 0, c.width, c.height);
        const data = nc.getContext('2d').getImageData(0, 0, nc.width, nc.height);
        setFrames(prev => {
            const next = [...prev, data];
            setCurrentFrame(next.length - 1);
            return next;
        });
    };

    // ─── Filtered palettes ────────────────────────────────────────────────
    const filteredPalettes = useMemo(() => {
        const result = {};
        for (const [cat, pals] of Object.entries(PALETTES)) {
            const filtered = Object.entries(pals).filter(([name]) =>
                !paletteSearch || name.toLowerCase().includes(paletteSearch.toLowerCase())
            );
            if (filtered.length) result[cat] = Object.fromEntries(filtered);
        }
        return result;
    }, [paletteSearch]);

    return (
        <div className="max-w-7xl mx-auto">
            <header className="text-center mb-2 md:mb-4">
                <h1 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 via-emerald-500 to-teal-400">
                    Pixel Forge Studio
                </h1>
                <p className="text-neutral-500 text-xs mt-0">pixel art · animation · sprite pipeline</p>
            </header>

          <div className="flex justify-center gap-4 mb-4 text-xs font-bold bg-neutral-800 p-2 rounded-lg w-max mx-auto border border-neutral-700">
              <div className="flex items-center gap-2">
                  <span className="text-neutral-400">Canvas Width:</span>
                  <input type="number" value={docW} onChange={(e)=>setDocW(parseInt(e.target.value)||64)} className="w-16 bg-black text-white p-1 rounded border border-neutral-600 text-center" />
              </div>
              <div className="flex items-center gap-2">
                  <span className="text-neutral-400">Canvas Height:</span>
                  <input type="number" value={docH} onChange={(e)=>setDocH(parseInt(e.target.value)||64)} className="w-16 bg-black text-white p-1 rounded border border-neutral-600 text-center" />
<button onClick={()=>{
                      const c = canvasRef.current;
                      c.width = docW;
                      c.height = docH;
                      const ctx = c.getContext('2d');
                      ctx.fillStyle='#000'; ctx.fillRect(0,0,docW,docH);
                      saveFrameState();
                  }} className="text-[10px] px-2 py-1 bg-blue-700 hover:bg-blue-600 rounded text-white ml-2" title="Apply canvas size">Apply</button>
              </div>
          </div>


            {/* TOOLBAR */}
            <div className="flex flex-wrap gap-1.5 items-center bg-neutral-800 border border-neutral-700 p-2 rounded-xl mb-3 toolbar-wrap">
                <div className="flex gap-1 bg-neutral-900 rounded-lg p-0.5">
                    {[['pencil','✏️'],['eraser','🧽'],['eyedropper','💉'],['fill','🪣'],['effect','🖌']].map(([t,icon]) => (
                        <button key={t} onClick={()=>setTool(t)} className={`tool-btn ${tool===t?'active':''}`} title={t}>{icon} {t==='eyedropper'?'pick':(t==='effect'?'fx':t)}</button>
                    ))}
                </div>
                <div className="w-px h-6 bg-neutral-700 mx-1 hidden md:block" />
                <div className="flex gap-1 bg-neutral-900 rounded-lg p-0.5">
                    {[['line','📏'],['rect','■'],['rect_outline','□'],['circle','●'],['circle_outline','○']].map(([t,icon]) => (
                        <button key={t} onClick={()=>setTool(t)} className={`tool-btn ${tool===t?'active':''}`} title={t}>{icon} {t.includes('outline')?'Outl':(t==='line'?'Line':(t==='rect'?'Fill':(t==='circle'?'Fill':'Grid')))}</button>
                    ))}
                </div>
                <div className="w-px h-6 bg-neutral-700 mx-1 hidden md:block" />
                <div className="flex items-center gap-1">
                    <span className="text-xs text-neutral-400">Brush</span>
                    <select value={brushSize} onChange={e=>setBrushSize(Number(e.target.value))}
                        className="bg-neutral-900 border border-neutral-700 rounded px-2 py-1 text-xs text-white">
                        {[1,2,3,5,7,9].map(s=><option key={s} value={s}>{s}px{s===1?' •':' ••'}</option>)}
                    </select>
                </div>
                <div className="flex items-center gap-1">
                    <button onClick={()=>setZoom(Math.max(25,zoom-25))} className="tool-btn" title="Zoom out">−</button>
                    <span className="text-xs font-mono w-10 text-center">{zoom}%</span>
                    <button onClick={()=>setZoom(Math.min(1000,zoom+25))} className="tool-btn" title="Zoom in">+</button>
                </div>
                <div className="flex gap-1">
                    <button onClick={()=>setCursorStyle(s=>s==='cross'?'dot':s==='dot'?'none':'cross')} className="tool-btn text-[10px]" title={"Cursor: "+cursorStyle}>{cursorStyle==='cross'?'﹢ Cross':cursorStyle==='dot'?'● Dot':'◌ None'}</button>
                </div>
                <div className="flex gap-1">
                    <button onClick={()=>{window.parent.PP.options.noDoubles=!window.parent.PP.options.noDoubles;ndRef.current=window.parent.PP.options.noDoubles;setNdTick(t=>t+1);}} className="tool-btn text-[10px]" title="No Doubles: skip same-color pixels">{ndRef.current?'◼ NoDup':'◻ NoDup'}</button>
                </div>
                <div className="flex gap-1">
                    <button onClick={undo} disabled={!undoStack.length} className="tool-btn" style={undoStack.length?{}:{opacity:.3}} title="Undo">↩</button>
                    <button onClick={redo} disabled={!redoStack.length} className="tool-btn" style={redoStack.length?{}:{opacity:.3}} title="Redo">↪</button>
                    <button onClick={clearCanvas} className="tool-btn text-red-400 hover:text-red-300" title="Clear canvas">🗑️</button>
                </div>
                
            
            </div>

            {tool==='effect' && (
                <div className="flex flex-wrap gap-3 items-center bg-neutral-800 border border-neutral-700 p-2 rounded-xl mb-3 text-xs">
                    <select value={effectType} onChange={e=>setEffectType(e.target.value)} className="bg-neutral-900 border border-neutral-700 rounded px-2 py-1 text-white">
                        <option value="hue">Hue shift</option>
                        <option value="bright">Brightness</option>
                        <option value="desat">Desaturate</option>
                        <option value="invert">Invert</option>
                        <option value="highlight">Highlight</option>
                        <option value="shadow">Shadow</option>
                        <option value="outline">Outline</option>
                    </select>
                    {(effectType==='hue'||effectType==='bright') && (
                        <label className="flex items-center gap-2 text-neutral-300">Amount
                            <input type="range" min={effectType==='hue'?-180:0} max={effectType==='hue'?180:200} value={hueShift} onChange={e=>setHueShift(+e.target.value)} />
                            <span className="w-8 text-right">{hueShift}</span>
                        </label>
                    )}
                    {(effectType==='highlight'||effectType==='shadow') && (
                        <label className="flex items-center gap-2 text-neutral-300">Intensity
                            <input type="range" min={0.05} max={0.6} step={0.01} value={effectStrength} onChange={e=>setEffectStrength(+e.target.value)} />
                            <span className="w-8 text-right">{effectStrength.toFixed(2)}</span>
                        </label>
                    )}
                    <span className="text-neutral-500">Brush paints the effect onto existing pixels only.</span>
                </div>
            )}


            {/* MAIN GRID */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-3">
                {/* CANVAS + TIMELINE */}
                <div className="lg:col-span-8 flex flex-col gap-2">
                    {/* Canvas */}
                    <div className="bg-neutral-800 border border-neutral-700 rounded-2xl overflow-hidden relative shadow-xl bg-checkered flex items-center justify-center min-h-[40vh]">
                        {!sourceImage && frames.length===0 && (
                            <div className="text-center p-8">
                                <div className="flex gap-4 justify-center mb-3">
                                    <button onClick={()=>fileRef.current?.click()}
                                        className="flex flex-col items-center gap-2 p-6 bg-neutral-700 hover:bg-neutral-600 rounded-xl" title="Upload photo to pixelate">
                                        <span className="text-3xl">📁</span>
                                        <span className="font-bold">Upload Photo</span>
                                    </button>
                                </div>
                                <input type="file" accept="image/*" ref={fileRef} onChange={handleUpload} className="hidden" />
                                <p className="text-neutral-500 text-xs">Or draw directly with the tools above</p>
                            </div>
                        )}
                        <div className="w-full h-full overflow-auto p-6 flex items-start justify-center">
                            <div style={{position:'relative',display:'inline-block'}}>
                            <canvas ref={canvasRef}
                                style={{ width: `${Math.min(480, 480*zoom/100)}px`, imageRendering:'pixelated', backgroundColor:'transparent', display:'block' }}
                                className={`shadow-2xl border border-neutral-700 ${isProcessing?'opacity-40':'opacity-100'} ${cursorStyle!=='none'?'cursor-none':tool==='eraser'?'cursor-cell':'cursor-crosshair'}`}
                                onMouseDown={handleDown} onMouseMove={handleMove} onMouseUp={handleUp} onMouseLeave={()=>{handleUp();setCursorPos(null);}}
                                onTouchStart={handleDown} onTouchMove={handleMove} onTouchEnd={handleUp}
                                onContextMenu={e=>e.preventDefault()} />
                            <canvas ref={overlayRef}
                                style={{ position:'absolute', top:0, left:0, width:`${Math.min(480, 480*zoom/100)}px`, height:`${Math.min(480, 480*zoom/100)}px`, pointerEvents:'none', imageRendering:'pixelated' }} />
                            </div>
                        </div>
                        {isProcessing && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/60 z-10">
                                <span className="text-green-400 font-bold animate-pulse text-lg">Pixelating...</span>
                            </div>
                        )}
                        {sourceImage && (
                            <button onClick={()=>setSourceImage(null)}
                                className="absolute top-3 right-3 px-2.5 py-1 bg-neutral-900/80 hover:bg-red-500/80 text-white rounded-lg text-xs z-20" title="Remove source image">
                                ✕
                            </button>
                        )}
                    </div>

                    {/* TIMELINE */}
                    <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-3">
                        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-neutral-400 uppercase">Frames</span>
                                <span className="text-xs text-neutral-500">{frames.length}</span>
                                <button onClick={addFrame} className="tool-btn text-xs !py-1 !px-2" title="Add frame">+ Add</button>
                                <button onClick={duplicateFrame} className="tool-btn text-xs !py-1 !px-2" disabled={!frames.length} title="Duplicate frame">⧉ Dup</button>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={()=>setPlaying(!playing)} className={`tool-btn text-xs !py-1 !px-3 ${playing?'bg-red-500 text-white':'bg-neutral-700'}`} title={playing?'Stop animation':'Play animation'}>
                                    {playing ? '⏹ Stop' : '▶ Play'}
                                </button>
                                <label className="text-xs text-neutral-400">FPS</label>
                                <input type="number" min="1" max="60" value={fps} onChange={e=>setFps(Math.max(1,Math.min(60,Number(e.target.value))))}
                                    className="w-12 bg-neutral-900 border border-neutral-700 rounded px-1 py-0.5 text-xs text-white text-center" />
                                <label className="text-xs text-neutral-400 flex items-center gap-1">
                                    <input type="checkbox" checked={loop} onChange={e=>setLoop(e.target.checked)} className="accent-green-500" /> Loop
                                </label>
                                <label className="text-xs text-neutral-400 flex items-center gap-1">
                                    <input type="checkbox" checked={onionSkin} onChange={e=>setOnionSkin(e.target.checked)} className="accent-green-500" /> Onion
                                </label>
                            </div>
                        </div>
                        <div className="timeline flex gap-2 overflow-x-auto pb-1">
                            {frames.map((data, idx) => (
                                <div key={idx} className="flex flex-col items-center gap-1 shrink-0">
                                    <div className="relative">
                                        <canvas width={48} height={48}
                                            ref={el => { if (el) { el.getContext('2d').putImageData(data,0,0); } }}
                                            className={`frame-thumb w-12 h-12 rounded border-2 ${idx===currentFrame?'active':'border-neutral-700'}`}
                                            onClick={() => { saveFrameState(); setCurrentFrame(idx); }}
                                            style={{imageRendering:'pixelated'}} />
                                        <button onClick={()=>deleteFrame(idx)}
                                            className="absolute -top-1.5 -right-1.5 w-4 h-4 bg-red-500 rounded-full text-[10px] leading-none text-white flex items-center justify-center hover:bg-red-400"
                                            style={{display:frames.length>1?'':'none'}} title="Delete frame">×</button>
                                    </div>
                                    <div className="flex gap-1 items-center">
                                        <button onClick={()=>moveFrame(idx,idx-1)} className="text-[10px] text-neutral-500 hover:text-white px-0.5" title="Move frame left">◀</button>
                                        <span className="text-[10px] text-neutral-500 font-mono">{idx+1}</span>
                                        <button onClick={()=>moveFrame(idx,idx+1)} className="text-[10px] text-neutral-500 hover:text-white px-0.5" title="Move frame right">▶</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>

                {/* RIGHT PANEL: PALETTES + EXPORT */}
                <div className="lg:col-span-4 flex flex-col gap-3">
                    {/* PALETTE */}
                    <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-3">
                        <button onClick={()=>setShowPalettes(!showPalettes)}
                            className="flex items-center gap-2 w-full text-left font-bold text-sm mb-2" title="Toggle palette panel">
                            <span>🎨</span> Palettes ({palette.length} colors) {showPalettes?'▼':'▶'}
                        </button>
                        {showPalettes && (
                            <>
                                <input type="text" value={paletteSearch} onChange={e=>setPaletteSearch(e.target.value)}
                                    placeholder="Search palettes..."
                                    className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-1.5 text-xs text-white mb-2 outline-none focus:border-green-500" />
                                <div className="flex flex-wrap gap-1 mb-2">
                                    {CATEGORIES.map(cat => (
                                        <button key={cat} onClick={()=>setActivePaletteCat(cat)}
                                            className={`text-[10px] px-2 py-0.5 rounded-full font-medium ${activePaletteCat===cat?'bg-green-500 text-white':'bg-neutral-700 text-neutral-300 hover:bg-neutral-600'}`} title={"Show "+cat+" palettes"}>
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                <div className="max-h-48 overflow-y-auto space-y-1">
                                    {Object.entries(filteredPalettes).map(([cat, pals]) => (
                                        <div key={cat} style={{display: activePaletteCat!==cat && paletteSearch ? 'block' : activePaletteCat!==cat ? 'none' : 'block'}}>
                                            <div className="text-[10px] text-neutral-500 font-bold uppercase mb-1">{cat}</div>
                                            {Object.entries(pals).map(([name, colors]) => (
                                                <div key={name} onClick={()=>selectPalette(name)}
                                                    className={`palette-card rounded-lg p-1.5 mb-1 ${palette===colors?'active':''}`}>
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-[11px] text-neutral-300">{name}</span>
                                                        <span className="text-[9px] text-neutral-600">{colors.length}c</span>
                                                    </div>
                                                    <div className="flex gap-0.5 mt-0.5 flex-wrap">
                                                        {colors.slice(0,16).map((c,i) => (
                                                            <div key={i} className="w-3 h-3 rounded-sm" style={{backgroundColor:c}} title={c} />
                                                        ))}
                                                        {colors.length > 16 && <span className="text-[8px] text-neutral-600 ml-0.5">+{colors.length-16}</span>}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    ))}
                                </div>
                            </>
                        )}
                    </div>

                    {/* ACTIVE PALETTE SWATCHES */}
                    <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-3">
                        <div className="flex items-center gap-2 mb-2">
                            <div className="w-6 h-6 rounded border border-neutral-500 shrink-0" style={{backgroundColor:selectedColor}} />
                            <span className="text-xs font-mono text-neutral-400">{selectedColor}</span>
                                <div className="flex gap-1 ml-auto">
                                <button onClick={()=>logColor(adjustColor(selectedColor,15))} className="text-[10px] px-1.5 py-0.5 bg-neutral-700 hover:bg-neutral-500 rounded font-medium" title="Lighten color">+L</button>
                                <button onClick={()=>logColor(adjustColor(selectedColor,-15))} className="text-[10px] px-1.5 py-0.5 bg-neutral-700 hover:bg-neutral-500 rounded font-medium" title="Darken color">-D</button>
                                <input type="color" value={selectedColor} onChange={e=>logColor(e.target.value)} className="w-7 h-7 bg-transparent border border-neutral-600 rounded cursor-pointer p-0" title="Native color picker" />
                            </div>
                            {/* SHADE / HUE GRADIENT FINDER — pick nearby shades from the active color */}
                            <div className="mt-2">
                                <div className="text-[10px] uppercase tracking-wider text-neutral-500 mb-1">Shade Finder</div>
                                <div className="grid gap-[2px]" style={{gridTemplateColumns:'repeat(9, 1fr)'}}>
                                    {(() => {
                                        const {r,g,b}=hexToRgb(selectedColor); const [h,s,v]=rgb2hsv(r,g,b);
                                        const rows=[-0.40,-0.25,-0.10,0,0.10,0.25,0.40]; const hues=[-90,-60,-30,0,30,60,90,120,-120];
                                        return rows.flatMap(dl => hues.map(dh => {
                                            const newS = clamp(s + (dh!==0?0.15*Math.sign(dh):0),0,1);
                                            const newV = clamp(v+dl,0,1);
                                            const newH = (h+dh+360)%360;
                                            const col = rgbToHex(...hsv2rgb(newH, newS, newV));
                                            return <button key={dl+':'+dh} onClick={()=>logColor(col)} title={`${col} (h${dh>0?'+':''}${dh}, l${dl>0?'+':''}${(dl*100|0)+'%'})`} className="w-full aspect-square rounded-sm border border-neutral-800 hover:border-white hover:z-10" style={{backgroundColor:col}} />;
                                        }));
                                    })()}
                                </div>
                                <div className="flex items-center gap-2 mt-2">
                                    <span className="text-[10px] text-neutral-500">Hue</span>
                                    <input type="range" min="0" max="360" value={Math.round(rgb2hsv(...Object.values(hexToRgb(selectedColor)))[0])} onChange={e=>{ const [h,s,v]=rgb2hsv(...Object.values(hexToRgb(selectedColor))); setSelectedColor(rgbToHex(...hsv2rgb(+e.target.value,s,v))); }} className="flex-1" />
                                </div>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-1 max-h-32 overflow-y-auto">
                            {palette.map((c, i) => (
                                <button key={i} onClick={()=>{logColor(c);setTool('pencil')}}
                                    className={`cswatch ${selectedColor===c?'active':''}`}
                                    style={{backgroundColor:c}} title={c} />
                            ))}
                        </div>
                        {/* Color log: every color used, in order */}
                        <div className="mt-2 pt-2 border-t border-neutral-700">
                            <div className="flex items-center justify-between mb-1">
                                <span className="text-[10px] uppercase tracking-wider text-neutral-500">Color Log ({colorLog.length})</span>
                                {colorLog.length>0 && <button onClick={()=>setColorLog([])} className="text-[9px] px-1.5 py-0.5 rounded bg-neutral-700 hover:bg-neutral-500 text-neutral-300" title="Clear color log">Clear</button>}
                            </div>
                            <div className="flex flex-wrap gap-1 max-h-20 overflow-y-auto">
                                {colorLog.length===0 && <span className="text-[9px] text-neutral-600">Colors you use appear here, in order.</span>}
                                {colorLog.map((c,i)=>(
                                    <button key={i} className="cswatch" style={{backgroundColor:c, width:18, height:18}} title={c} onClick={()=>pickColor(c)} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* EXPORT */}
                    <div className="bg-neutral-800 border border-neutral-700 rounded-xl p-3 space-y-2">
                        <div className="text-sm font-bold flex items-center gap-2"><span>💾</span> Export</div>
                        <div className="grid grid-cols-2 gap-2 text-xs">
                            <div>
                                <label className="text-neutral-400 block mb-0.5">Scale</label>
                                <select value={exportScale} onChange={e=>setExportScale(e.target.value)}
                                    className="w-full bg-neutral-900 border border-neutral-700 rounded p-1.5 text-white">
                                    {[1,2,4,8].map(s=><option key={s} value={s}>{s}x{s}{s===1?' (raw)':''}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="text-neutral-400 block mb-0.5">Format</label>
                                <select value={exportFormat} onChange={e=>setExportFormat(e.target.value)}
                                    className="w-full bg-neutral-900 border border-neutral-700 rounded p-1.5 text-white">
                                    <option value="spritesheet">Spritesheet PNG</option>
                                    {frames.length > 1 && <option value="gif">Animated GIF</option>}
                                    <option value="png">Single PNG</option>
                                </select>
                            </div>
                        </div>
                        <button onClick={()=>setShowSave(true)}
                            className="w-full py-2.5 rounded-xl font-bold text-sm bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white shadow-lg shadow-blue-900/30 transition-all active:scale-95" title="Open export dialog">
                            🎬 Export
                        </button>
                        <div className="text-[10px] text-neutral-600 text-center">
                            {res}×{res}px · {frames.length} frame{frames.length!==1?'s':''} · scale {exportScale}×
                        </div>
                    </div>
                </div>
            </div>

            {/* SAVE MODAL */}
            {showSave && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm" onClick={()=>setShowSave(false)}>
                    <div className="bg-neutral-800 border border-neutral-600 p-5 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl" onClick={e=>e.stopPropagation()}>
                        <h3 className="text-lg font-bold">🎬 Export {exportFormat.toUpperCase()}</h3>
                        <div>
                            <label className="text-xs text-neutral-400 block mb-1">File Name</label>
                            <input type="text" value={saveName} onChange={e=>setSaveName(e.target.value)}
                                className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-2.5 text-white text-sm outline-none focus:border-green-500" autoFocus />
                        </div>
                        <div className="text-xs text-neutral-500 bg-neutral-900 p-2 rounded-lg">
                            {exportFormat==='spritesheet' && `Spritesheet: frames laid out in grid → ${saveName}_spritesheet.png`}
                            {exportFormat==='gif' && `Animated GIF: ${frames.length} frames @ ${fps} FPS`}
                            {exportFormat==='png' && `Single frame: current frame #${currentFrame+1}`}
                        </div>
                        <div className="flex gap-3 pt-1">
                            <button onClick={()=>setShowSave(false)}
                                className="flex-1 py-2.5 bg-neutral-700 hover:bg-neutral-600 rounded-xl font-bold text-sm" title="Cancel export">Cancel</button>
                            <button onClick={handleExport}
                                className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-sm shadow-lg" title="Confirm and export">Export</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const adjustColor = (hex, amt) => {
    const c = hexToRgb(hex);
    return rgbToHex(Math.max(0,Math.min(255,c.r+amt)), Math.max(0,Math.min(255,c.g+amt)), Math.max(0,Math.min(255,c.b+amt)));
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

<script>
// Pixel Palace <-> Hub bridge
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='EXPORT_CANVAS'){
    var c=document.querySelector('canvas');
    if(c && c.toDataURL){ try{ parent.postMessage({type:'CANVAS_DATA',from:'studio',data:c.toDataURL()},'*'); }catch(err){} }
  }
  if(d.type==='LOAD_CANVAS' && d.data && d.data.studio){
    try{ if(window.__ppLoadCanvas) window.__ppLoadCanvas(d.data.studio); }catch(err){}
  }
});
</script>

</body>
</html>
