*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#eee;font-family:'Inter','Segoe UI',system-ui,'Segoe UI Symbol','Segoe UI Emoji',sans-serif;overflow:hidden;height:100dvh;touch-action:none;-webkit-user-select:none;user-select:none}
#root{height:100dvh;display:flex;flex-direction:column}
canvas{image-rendering:pixelated;touch-action:none}
.tool-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#ccc;cursor:pointer;transition:.15s;font-size:14px;flex-shrink:0}
.tool-btn:hover{background:#2a2a2a;border-color:#555}
.tool-btn.active{background:#2563eb;border-color:#3b82f6;color:#fff}
.tool-btn:disabled{opacity:.3;cursor:default}
.palette-swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.1s;flex-shrink:0}
.palette-swatch:hover{border-color:#666;transform:scale(1.1)}
.palette-swatch.active{border-color:#fff}
.timeline-frame{width:56px;height:56px;border:2px solid #333;border-radius:6px;cursor:pointer;flex-shrink:0;position:relative;background:#1a1a1a}
.timeline-frame.active{border-color:#3b82f6}
.timeline-frame.drag-over{border-color:#22c55e}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid #333;padding:10px 20px;border-radius:12px;font-size:13px;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,.5);transition:opacity .3s}
.modal-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);padding:12px}
.modal-content{background:#1f1f1f;border:1px solid #333;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.godown{appearance:none;-webkit-appearance:none;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#eee;padding:6px 10px;font-size:13px;width:auto}
.godown option{background:#1a1a1a;color:#eee}
input[type=number].godown::-webkit-inner-spin-button,input[type=number].godown::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number].godown{-moz-appearance:textfield;appearance:textfield}
.swatch{width:32px;height:32px;padding:0;border:1px solid #333;border-radius:8px;background:#1a1a1a;cursor:pointer;flex-shrink:0}
.godown:focus{border-color:#3b82f6;outline:none}
input[type=range]{-webkit-appearance:none;background:#333;height:4px;border-radius:2px;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#3b82f6;cursor:pointer}
input[type=color]{-webkit-appearance:none;border:none;width:32px;height:32px;border-radius:6px;cursor:pointer;padding:0}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:none;border-radius:6px}
.layer-row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:.1s;border:1px solid transparent}
.layer-row:hover{background:#2a2a2a}
.layer-row.active{background:#1e3a5f;border-color:#3b82f6}
.tile-preview{width:32px;height:32px;border:1px solid #333;border-radius:4px;image-rendering:pixelated;flex-shrink:0;cursor:pointer}
.tile-preview.active{border-color:#3b82f6}
.scrollbar-thin::-webkit-scrollbar{width:4px;height:4px}
.scrollbar-thin::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
details.ai-panel-details>summary{list-style:none}
details.ai-panel-details>summary::-webkit-details-marker{display:none}
details summary{outline:none}

// Perlin noise (simplified 2D)
class Perlin{
  constructor(seed=Math.random()*9999){
    this.grad=[];for(let i=0;i<256;i++)this.grad[i]=i;
    for(let i=255;i>0;i--){const j=Math.floor((seed+i*7919)%(i+1));[this.grad[i],this.grad[j]]=[this.grad[j],this.grad[i]];}
    this.perm=this.grad.concat(this.grad);
  }
  fade(t){return t*t*t*(t*(t*6-15)+10)}
  lerp(a,b,t){return a+t*(b-a)}
  dot(g,x,y){return(g&1?x:-x)+(g&2?y:-y)}
  noise(x,y){
    const X=Math.floor(x)&255,Y=Math.floor(y)&255;
    const xf=x-Math.floor(x),yf=y-Math.floor(y);
    const u=this.fade(xf),v=this.fade(yf);
    const aa=this.perm[this.perm[X]+Y],ab=this.perm[this.perm[X]+Y+1];
    const ba=this.perm[this.perm[X+1]+Y],bb=this.perm[this.perm[X+1]+Y+1];
    return this.lerp(this.lerp(this.dot(this.grad[aa%256],xf,yf),this.dot(this.grad[ba%256],xf-1,yf),u),
                     this.lerp(this.dot(this.grad[ab%256],xf,yf-1),this.dot(this.grad[bb%256],xf-1,yf-1),u),v);
  }
  fbm(x,y,octaves=4,lacunarity=2,gain=.5){
    let v=0,amp=1,freq=1,max=0;
    for(let i=0;i<octaves;i++){v+=amp*this.noise(x*freq,y*freq);max+=amp;amp*=gain;freq*=lacunarity;}
    return v/max;
  }
}

            const jx=ox+(perlin.fbm(ox*0.3,oy*0.3,2,0.5,0.5)-0.5)*size*0.3;
            const jy=oy+(perlin.fbm(oy*0.3,ox*0.3,2,0.5,0.5)-0.5)*size*0.3;
            layerCtx.fillStyle=(Math.random()<0.5?base:light);
            layerCtx.beginPath();layerCtx.arc(cx+jx,cy+jy,Math.abs(r),0,Math.PI*2);layerCtx.fill();
          }
          break;
        }
        case'bush':{
          const blobs=[[-size*0.5,size*0.1,size*0.75],[size*0.5,size*0.1,size*0.75],[-size*0.2,-size*0.3,size*0.7],[size*0.2,-size*0.3,size*0.7],[0,size*0.3,size*0.85]];
          for(const [ox,oy,r] of blobs){ layerCtx.fillStyle=(Math.random()<0.5?base:light); layerCtx.beginPath();layerCtx.arc(x+ox,y+oy,Math.abs(r),0,Math.PI*2);layerCtx.fill(); }
          break;
        }
        case'grass':{
          const blades=Math.max(5,Math.floor(size*1.2));
          for(let i=0;i<blades;i++){
            const ox=(Math.random()-0.5)*size*1.2;
            const bh=size*(0.6+Math.random()*0.9);
            const bw=Math.max(1,size*0.13);
            const bx=x+ox;
            layerCtx.fillStyle=pick();
            layerCtx.beginPath();
            layerCtx.moveTo(bx-bw,y);
            layerCtx.quadraticCurveTo(bx,y-bh*0.5,bx,y-bh);
            layerCtx.quadraticCurveTo(bx,y-bh*0.5,bx+bw,y);
            layerCtx.closePath();layerCtx.fill();
          }
          break;
        }
        case'flower':{
          const petals=6, R=size*1.3;
          for(let i=0;i<petals;i++){
            const a=(Math.PI*2/petals)*i;
            const px=x+Math.cos(a)*R, py=y+Math.sin(a)*R;
            layerCtx.fillStyle=(i%2?light:base);
            layerCtx.beginPath();layerCtx.ellipse(px,py,size*0.6,size*0.32,a,0,Math.PI*2);layerCtx.fill();
          }
          layerCtx.fillStyle=shadeColor(base,0.45);
          layerCtx.beginPath();layerCtx.arc(x,y,size*0.5,0,Math.PI*2);layerCtx.fill();
          break;
        }
        default:return;
      }
      layerCtx.restore();commitStroke();
    };

   const addLayer=()=>{
    const name='Layer '+(layers.length+1);
    setLayers([...layers,makeLayer(w,h,name)]);
    setActiveLayerIdx(layers.length);
  };
  const deleteLayer=(idx)=>{
    if(layers.length<=1){show('Need at least 1 layer');return;}
    const next=layers.filter((_,i)=>i!==idx);
    setLayers(next);
    setActiveLayerIdx(Math.min(idx,next.length-1));
  };
  const duplicateLayer=(idx)=>{
    const src=layers[idx];
    const newFrames=src.frames.map(f=>{
      const nc=document.createElement('canvas');nc.width=f.canvas.width;nc.height=f.canvas.height;
      nc.getContext('2d').drawImage(f.canvas,0,0);
      return{id:uid(),duration:f.duration,canvas:nc,ctx:nc.getContext('2d')};
    });
    const dup={...src,id:uid(),name:src.name+' copy',frames:newFrames};
    const next=[...layers];next.splice(idx+1,0,dup);
    setLayers(next);setActiveLayerIdx(idx+1);
  };
  const toggleLayerVis=(idx)=>setLayers(layers.map((l,i)=>i===idx?{...l,visible:!l.visible}:l));
  const setLayerOpacity=(idx,op)=>setLayers(layers.map((l,i)=>i===idx?{...l,opacity:clamp(op,0,1)}:l));

  // ─── FRAME OPERATIONS ────────────────────────────────────────────────────
  const currentFrames=activeLayer?.frames||[];
  const addFrame=()=>{
    const nc=document.createElement('canvas');nc.width=w;nc.height=h;
    const ctx=nc.getContext('2d');
    ctx.drawImage(layerCanvas,0,0);
    const newFrames=[...currentFrames,{id:uid(),duration:100,canvas:nc,ctx}];
    setLayers(layers.map((l,i)=>i===activeLayerIdx?{...l,frames:newFrames,currentFrame:newFrames.length-1}:l));
  };
  const dupFrame=()=>{
    const nc=document.createElement('canvas');nc.width=w;nc.height=h;
    nc.getContext('2d').drawImage(layerCanvas,0,0);
    const idx=activeLayer.currentFrame;
    const newFrames=[...currentFrames];
    newFrames.splice(idx+1,0,{id:uid(),duration:100,canvas:nc,ctx:nc.getContext('2d')});
    setLayers(layers.map((l,i)=>i===activeLayerIdx?{...l,frames:newFrames,currentFrame:idx+1}:l));
  };
  const delFrame=()=>{
    if(currentFrames.length<=1){show('Need at least 1 frame');return;}
    const idx=activeLayer.currentFrame;
    const newFrames=currentFrames.filter((_,i)=>i!==idx);
    setLayers(layers.map((l,i)=>i===activeLayerIdx?{...l,frames:newFrames,currentFrame:Math.min(idx,newFrames.length-1)}:l));
  };
  const setFrame=(idx)=>setLayers(layers.map((l,i)=>i===activeLayerIdx?{...l,currentFrame:idx}:l));

  // ── Artwork transforms (Flip H / Flip V / Rotate 90°) ──
  // Default: apply to the CURRENT frame of the active layer only. Toggle
  // "All frames" to transform every frame of every layer (and resize the doc).
  const transformArtwork=(op)=>{
    const rot=op==='rotCW';
    const nw=rot?h:w, nh=rot?w:h;
    const m = op==='flipH' ? [ -1, 0, 0, 1, w-1, 0 ]
            : op==='flipV' ? [ 1, 0, 0, -1, 0, h-1 ]
            : [ 0, 1, -1, 0, nh-1, 0 ]; // 90° CW
    const applyOne=(f)=>{
        const nc=document.createElement('canvas'); nc.width=nw; nc.height=nh;
        const nx=nc.getContext('2d'); nx.imageSmoothingEnabled=false;
        nx.setTransform(m[0],m[1],m[2],m[3],m[4],m[5]);
        nx.drawImage(f.canvas,0,0);
        nx.setTransform(1,0,0,1,0,0); // reset so future drawing isn't rotated/misaligned
        return { ...f, canvas:nc, ctx:nx };
    };
    if(allFrames){
      const next=layers.map(l=>({ ...l, frames: l.frames.map(applyOne) }));
      setLayers(next);
      if(rot){ setW(nw); setH(nh); try{ parent.postMessage({type:'DOC_UPDATE',from:'editor',patch:{w:nw,h:nh}},'*'); }catch(e){} }
    } else {
      const idx=activeLayer.currentFrame;
      const next=layers.map((l,i)=>{
        if(i!==activeLayerIdx) return l;
        return { ...l, frames: l.frames.map((f,fi)=> fi===idx ? applyOne(f) : f) };
      });
      setLayers(next);
    }
    show((allFrames?'All frames: ':'Current frame: ')+(op==='flipH'?'Flipped horizontally':op==='flipV'?'Flipped vertically':'Rotated 90°'));
  };

  // ─── DRAWING ─────────────────────────────────────────────────────────────
  const getPos=(e)=>{
    const c=displayRef.current;if(!c)return null;
    const rect=c.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-rect.left;
    const cy=(e.touches?e.touches[0].clientY:e.clientY)-rect.top;
    const scale=zoom/100;
    const px=Math.floor(cx/scale),py=Math.floor(cy/scale);
    if(px<0||px>=w||py<0||py>=h)return null;
    return{x:px,y:py};
  };

  const commitStroke=()=>{/* triggers re-render */setLayers(l=>[...l]);};

  const drawPixel=(p)=>{
    if(!layerCtx||mode==='tile')return;
    layerCtx.fillStyle=color;
    const bw=Math.max(1,brushSize|0);
    if(bw<=1)layerCtx.fillRect(p.x,p.y,1,1);
    else{
      const half=Math.floor(bw/2);
      if(bw<=3)layerCtx.fillRect(p.x-half,p.y-half,bw,bw);
      else for(let dx=-half;dx<=half;dx++)for(let dy=-half;dy<=half;dy++)
        if(dx*dx+dy*dy<=half*half)layerCtx.fillRect(p.x+dx,p.y+dy,1,1);
    }
    commitStroke();
  };
  const erasePixel=(p)=>{
    if(!layerCtx||mode==='tile')return;
    const bw=Math.max(1,brushSize|0);
    const half=Math.floor(bw/2);
    for(let dx=-half;dx<=half;dx++)for(let dy=-half;dy<=half;dy++)
      if(dx*dx+dy*dy<=half*half)layerCtx.clearRect(p.x+dx,p.y+dy,1,1);
    commitStroke();
  };

  // Effect brush — applies selected effect to brushed pixels only (not whole page)
  const applyEffectAt=(x,y)=>{
    if(!layerCtx||mode==='tile')return;
    const bw=Math.max(1,brushSize|0);
    const half=Math.floor(bw/2);
    const opaque=(xx,yy)=>{ if(xx<0||yy<0||xx>=w||yy>=h)return false; const dd=layerCtx.getImageData(xx,yy,1,1).data; return dd[3]>0; };
    for(let dx=-half;dx<=half;dx++)for(let dy=-half;dy<=half;dy++){
      if(dx*dx+dy*dy>half*half)continue;
      const px=x+dx,py=y+dy;
      if(px<0||py<0||px>=w||py>=h)continue;
      const d=layerCtx.getImageData(px,py,1,1).data;
      if(d[3]===0)continue;
      let r=d[0],g=d[1],b=d[2],a=d[3];
      if(effectType==='hue'){const hsv=rgb2hsv(r,g,b);hsv[0]=(hsv[0]+hueShift/360)%1;if(hsv[0]<0)hsv[0]+=1;const c=hsv2rgb(hsv[0],hsv[1],hsv[2]);r=c[0];g=c[1];b=c[2];}
      else if(effectType==='bright'){const f=1+hueShift/100;r=Math.max(0,Math.min(255,Math.round(r*f)));g=Math.max(0,Math.min(255,Math.round(g*f)));b=Math.max(0,Math.min(255,Math.round(b*f)));}
      else if(effectType==='desat'){const av=Math.round((r+g+b)/3);r=g=b=av;}
      else if(effectType==='invert'){r=255-r;g=255-g;b=255-b;}
      else if(effectType==='highlight'){const hsv=rgb2hsv(r,g,b);let h=hsv[0]+(hsv[1]>0.05?(effectSpread/360):0);if(h>=1)h-=1;const c=hsv2rgb(h,hsv[1],Math.min(1,hsv[2]+effectStrength));r=c[0];g=c[1];b=c[2];}
      else if(effectType==='shadow'){const hsv=rgb2hsv(r,g,b);let h=hsv[0]-(hsv[1]>0.05?(effectSpread/360):0);if(h<0)h+=1;const c=hsv2rgb(h,hsv[1],Math.max(0,hsv[2]-effectStrength));r=c[0];g=c[1];b=c[2];}
      else if(effectType==='outline'){const isEdge=opaque(px,py)&&!(opaque(px-1,py)&&opaque(px+1,py)&&opaque(px,py-1)&&opaque(px,py+1));if(!isEdge){a=0;}}
      const img=new ImageData(new Uint8ClampedArray([r,g,b,a]),1,1);
      layerCtx.putImageData(img,px,py);
    }
    setUiTick(t=>t+1);
  };

  // Eyedropper
  const pickColor=(p)=>{
    if(!layerCtx)return;

    const px=layerCtx.getImageData(p.x,p.y,1,1).data;
    if(px[3]>0)pickColor(rgbToHex(px[0],px[1],px[2]));
  };

  // Flood fill
  const floodFill=(startX,startY)=>{
    if(!layerCtx)return;

    const img=layerCtx.getImageData(0,0,w,h),d=img.data;
    const idx=(startY*w+startX)*4;
    const sr=d[idx],sg=d[idx+1],sb=d[idx+2],sa=d[idx+3];
    const cr=parseInt(color.slice(1,3),16),cg=parseInt(color.slice(3,5),16),cb=parseInt(color.slice(5,7),16);
    if(sr===cr&&sg===cg&&sb===cb&&sa===255)return;
    const visited=new Uint8Array(w*h);
    const stack=[[startX,startY]];
    while(stack.length){
      const [x,y]=stack.pop();
      if(x<0||x>=w||y<0||y>=h)continue;
      if(visited[y*w+x])continue;
      const i=(y*w+x)*4;
      if(d[i]!==sr||d[i+1]!==sg||d[i+2]!==sb||d[i+3]!==sa)continue;
      visited[y*w+x]=1;
      d[i]=cr;d[i+1]=cg;d[i+2]=cb;d[i+3]=255;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    layerCtx.putImageData(img,0,0);
    commitStroke();
  };

  const floodErase=(startX,startY)=>{
    if(!layerCtx)return;

    const img=layerCtx.getImageData(0,0,w,h),d=img.data;
    const idx=(startY*w+startX)*4;
    const sr=d[idx],sg=d[idx+1],sb=d[idx+2],sa=d[idx+3];
    const stack=[[startX,startY]];
    const visited=new Uint8Array(w*h);
    while(stack.length){
      const [x,y]=stack.pop();
      if(x<0||x>=w||y<0||y>=h)continue;
      if(visited[y*w+x])continue;
      const i=(y*w+x)*4;
      if(d[i]!==sr||d[i+1]!==sg||d[i+2]!==sb||d[i+3]!==sa)continue;
      visited[y*w+x]=1;
      d[i+3]=0;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    layerCtx.putImageData(img,0,0);
    commitStroke();
  };

  const swapColors=()=>{
    const map=swapPairs.filter(p=>p.from&&p.to&&p.from!==p.to).map(p=>({
      fr:parseInt(p.from.slice(1,3),16),fg:parseInt(p.from.slice(3,5),16),fb:parseInt(p.from.slice(5,7),16),
      tr:parseInt(p.to.slice(1,3),16),tg:parseInt(p.to.slice(3,5),16),tb:parseInt(p.to.slice(5,7),16),
    }));
    if(!map.length){show('Add at least one color pair');return;}
    let changed=0;
    setLayers(prev=>prev.map(l=>({
      ...l,
      frames: l.frames.map(f=>{
        const c=f.canvas,ctx=c.getContext('2d');
        const img=ctx.getImageData(0,0,w,h),d=img.data;
        const out=new Uint8ClampedArray(d);
        for(let p=0;p<d.length;p+=4){
          if(d[p+3]!==255)continue;
          for(const m of map){
            if(d[p]===m.fr&&d[p+1]===m.fg&&d[p+2]===m.fb){out[p]=m.tr;out[p+1]=m.tg;out[p+2]=m.tb;changed++;break;}
          }
        }
        ctx.putImageData(new ImageData(out,c.width,c.height),0,0);
        return {...f,canvas:c,ctx};
      })
    })));
    commitStroke();setShowEffects(false);
    show(`Palette swapped (${changed} px across all layers)`);
  };

  // Shape drawing helpers
  const drawLine=(x1,y1,x2,y2)=>{
    if(!layerCtx)return;

    layerCtx.fillStyle=color;
    const bw=Math.max(1,brushSize|0);
    const dx=Math.abs(x2-x1),dy=Math.abs(y2-y1);
    const steps=Math.max(dx,dy);
    for(let i=0;i<=steps;i++){
      const t=i/steps;
      const x=Math.round(lerp(x1,x2,t)),y=Math.round(lerp(y1,y2,t));
      const half=Math.floor(bw/2);
      for(let ox=-half;ox<=half;ox++)for(let oy=-half;oy<=half;oy++)
        if(ox*ox+oy*oy<=half*half)layerCtx.fillRect(x+ox,y+oy,1,1);
    }
  };
  const drawRectFill=(x1,y1,x2,y2)=>{
    if(!layerCtx)return;

    layerCtx.fillStyle=color;
    const lx=Math.min(x1,x2),rx=Math.max(x1,x2),ty=Math.min(y1,y2),by=Math.max(y1,y2);
    layerCtx.fillRect(lx,ty,rx-lx+1,by-ty+1);
  };
  const drawRectOutline=(x1,y1,x2,y2)=>{
    if(!layerCtx)return;

    layerCtx.fillStyle=color;
    const lx=Math.min(x1,x2),rx=Math.max(x1,x2),ty=Math.min(y1,y2),by=Math.max(y1,y2);
    const bw=Math.max(1,brushSize|0);
    for(let x=lx;x<=rx;x++)for(let i=0;i<bw;i++){
      if(ty+i<by)layerCtx.fillRect(x,ty+i,1,1);
      if(by-i>ty)layerCtx.fillRect(x,by-i,1,1);
    }
    for(let y=ty;y<=by;y++)for(let i=0;i<bw;i++){
      if(lx+i<rx)layerCtx.fillRect(lx+i,y,1,1);
      if(rx-i>lx)layerCtx.fillRect(rx-i,y,1,1);
    }
  };
  const drawCircleFill=(x1,y1,x2,y2)=>{
    if(!layerCtx)return;

    const cx=(x1+x2)/2,cy=(y1+y2)/2,rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;
    if(rx<.5||ry<.5)return;
    layerCtx.fillStyle=color;
    for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
      for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)
        if(((x-cx)/rx)**2+((y-cy)/ry)**2<=1)layerCtx.fillRect(x,y,1,1);
  };
  const drawCircleOutline=(x1,y1,x2,y2)=>{
    if(!layerCtx)return;

    const cx=(x1+x2)/2,cy=(y1+y2)/2,rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;
    if(rx<.5||ry<.5)return;
    layerCtx.fillStyle=color;
    for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
      for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){
        const v=((x-cx)/rx)**2+((y-cy)/ry)**2;
        if(v>=.8&&v<=1)layerCtx.fillRect(x,y,1,1);
      }
  };

  // TILE MODE
  const placeTile=(px,py)=>{
    if(!layerCtx||mode!=='tile'||selectedTile<0||!tileSpritesheet)return;
    const ts=tileSize;
    const tx=Math.floor(px/ts),ty=Math.floor(py/ts);
    const sx=(selectedTile%tilesetCols)*ts,sy=Math.floor(selectedTile/tilesetCols)*ts;
    layerCtx.drawImage(tileSpritesheet,sx,sy,ts,ts,tx*ts,ty*ts,ts,ts);
    commitStroke();
  };

   // ─── HANDLERS ────────────────────────────────────────────────────────────
    const handleDown=(e)=>{
      if(e.touches)e.preventDefault();
      const p=getPos(e);if(!p)return;
      if(e.button===2||e.button===1){ if(tool!=='eyedropper'&&mode!=='tile'){ erasePixel(p); } return; }
      if(tool==='eyedropper'){pickColor(p);return;}
     if(mode==='tile'){placeTile(p.x,p.y);return;}
     if(tool==='erasefill'){floodErase(p.x,p.y);return;}
    if(['fill'].includes(tool)){floodFill(p.x,p.y);return;}
     if(['line','rect','rect_outline','circle','circle_outline','gradient','natural'].includes(tool)){
        shapeSnapRef.current=snapshotLayer();
        setDrawOrigin(p);setDrawing(true);
        return;
      }
      if(tool==='select'){
        const inside=(r,pp)=> r && pp.x>=r.x && pp.x<r.x+r.w && pp.y>=r.y && pp.y<r.y+r.h;
        const nr=selRect?normRect(selRect):null;
        if(selLift && inside({x:selLift.ox,y:selLift.oy,w:selLift.w,h:selLift.h},p)){
          selGrabOffset.current={x:p.x-selLift.ox,y:p.y-selLift.oy}; setSelMode('move'); setDrawing(true); return;
        }
        if(nr && inside(nr,p)){
          const lift=liftSelection(nr);
          if(lift){ setSelLift(lift); selGrabOffset.current={x:p.x-lift.ox,y:p.y-lift.oy}; setSelMode('move'); setDrawing(true); return; }
        }
        setSelRect({x:p.x,y:p.y,w:1,h:1}); setSelMode('define'); setDrawing(true); return;
      }
      setDrawing(true);
      if(tool==='pencil')drawPixel(p);
     else if(tool==='eraser')erasePixel(p);
     else if(tool==='greeble')drawGreeble(p);
     else if(tool==='effect')applyEffectAt(p.x,p.y);
     else if(tool==='natural')setDrawOrigin(p);setDrawing(true);setUiTick(t=>t+1);
   };
   const handleMove=(e)=>{

    if(isPanning) {
        setPanX(p => p + e.movementX);
        setPanY(p => p + e.movementY);
        return;
    }

     if(e.touches)e.preventDefault();
     const p=getPos(e);if(!p)return;
      if(!drawing&&mode!=='tile')return;setUiTick(t=>t+1);
      if(tool==='select'){
        if(selMode==='define'){ setSelRect(r=>r?{...r,w:Math.max(1,p.x-r.x+1),h:Math.max(1,p.y-r.y+1)}:r); }
        else if(selMode==='move'&&selLift){ setSelLift(l=>l?{...l,ox:p.x-selGrabOffset.current.x,oy:p.y-selGrabOffset.current.y}:l); }
        return;
      }
      if(tool==='pencil')drawPixel(p);
      else if(tool==='eraser')erasePixel(p);
      else if(tool==='greeble')drawGreeble(p);
      else if(tool==='effect')applyEffectAt(p.x,p.y);
      else if(['line','rect','rect_outline','circle','circle_outline','gradient','natural'].includes(tool)&&drawOrigin&&shapeSnapRef.current){
        restoreLayer();
        if(tool==='line')drawLine(drawOrigin.x,drawOrigin.y,p.x,p.y);
        else if(tool==='rect')drawRectFill(drawOrigin.x,drawOrigin.y,p.x,p.y);
        else if(tool==='rect_outline')drawRectOutline(drawOrigin.x,drawOrigin.y,p.x,p.y);
        else if(tool==='circle')drawCircleFill(drawOrigin.x,drawOrigin.y,p.x,p.y);
        else if(tool==='circle_outline')drawCircleOutline(drawOrigin.x,drawOrigin.y,p.x,p.y);
        else if(tool==='gradient')drawGradient(drawOrigin.x,drawOrigin.y,p.x,p.y);
        else if(tool==='natural'){const size=Math.min(Math.hypot(drawOrigin.x-p.x,drawOrigin.y-p.y),Math.max(w,h)*0.3);drawNaturalShape(shapePreset||getToolPreset(tool),drawOrigin.x,drawOrigin.y,size);}
      }
   };
   const handleUp=(e)=>{

     if(isPanning) { setIsPanning(false); return; }

      if(tool==='select'){

  const rgb2hsv=(r,g,b)=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}const s=mx?d/mx:0;return [h,s,mx];};

          const na=d[((y-1)*w+x)*4+3],sa=d[((y+1)*w+x)*4+3],wa=d[(y*w+x-1)*4+3],ea=d[(y*w+x+1)*4+3];
          if(a>128&&(na<128||sa<128||wa<128||ea<128)){od[i]=0;od[i+1]=0;od[i+2]=0;od[i+3]=255;}
          else{od[i+3]=0;}
        }
        layerCtx.putImageData(outlineImg,0,0);commitStroke();return;
      case'shadow':
        const offX=2,offY=2;
        const shadImg=layerCtx.getImageData(0,0,w,h),sd=shadImg.data;
        layerCtx.clearRect(0,0,w,h);
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const i=(y*w+x)*4;
          if(sd[i+3]>128&&x+offX<w&&y+offY<h){const ni=((y+offY)*w+x+offX)*4;d[ni]=0;d[ni+1]=0;d[ni+2]=0;d[ni+3]=128;}
        }
        for(let i=0;i<d.length;i+=4)if(sd[i+3]>128){d[i]=sd[i];d[i+1]=sd[i+1];d[i+2]=sd[i+2];d[i+3]=255;}
        break;
      case'noise_cloud':
        for(let y=0;y<h;y++)for(let x=0;x<w;x++){
          const i=(y*w+x)*4,n=perlin.fbm(x/w*4,y/h*4,3)*.5+.5;
          if(d[i+3]>0){const f=n;d[i]=d[i]*f|0;d[i+1]=d[i+1]*f|0;d[i+2]=d[i+2]*f|0;}
        }
        break;
        case'pixelate':{ const bs=Math.max(1,pixelateSize|0); const nw=Math.ceil(w/bs),nh=Math.ceil(h/bs); const small=document.createElement('canvas');small.width=nw;small.height=nh;const sx=small.getContext('2d');sx.imageSmoothingEnabled=false;sx.drawImage(layerCtx.canvas,0,0,nw,nh);layerCtx.clearRect(0,0,w,h);layerCtx.imageSmoothingEnabled=false;layerCtx.drawImage(small,0,0,w,h);window.__ppLastEffect='pix_ok';window.__ppPixSize=bs;setUiTick(t=>t+1);commitStroke();show('Pixelated');return; }
        case'hue':{ const img0=layerCtx.getImageData(0,0,w,h),dd=img0.data; for(let i=0;i<dd.length;i+=4){ if(dd[i+3]===0)continue; let hsv=rgb2hsv(dd[i],dd[i+1],dd[i+2]); hsv[0]=(hsv[0]+hueShift/360)%1; if(hsv[0]<0)hsv[0]+=1; const c=hsv2rgb(hsv[0],hsv[1],hsv[2]); dd[i]=c[0];dd[i+1]=c[1];dd[i+2]=c[2]; } layerCtx.putImageData(img0,0,0); window.__ppLastEffect='hue_ok';setUiTick(t=>t+1);commitStroke();show('Hue shifted');return; }
        case'saturate':{ const img0=layerCtx.getImageData(0,0,w,h),dd=img0.data; for(let i=0;i<dd.length;i+=4){ if(dd[i+3]===0)continue; let hsv=rgb2hsv(dd[i],dd[i+1],dd[i+2]); hsv[1]=Math.max(0,Math.min(1,hsv[1]*1.6)); const c=hsv2rgb(hsv[0],hsv[1],hsv[2]); dd[i]=c[0];dd[i+1]=c[1];dd[i+2]=c[2]; } layerCtx.putImageData(img0,0,0); commitStroke();show('Saturated');return; }
       default:show('Unknown effect');return;
    }
    layerCtx.putImageData(img,0,0);
    commitStroke();
    show('Applied: '+effectName);

  const importImage=(file,callback)=>{

        const nw=img.naturalWidth||w, nh=img.naturalHeight||h;
        const nc=document.createElement('canvas');nc.width=nw;nc.height=nh;
        const ctx=nc.getContext('2d');ctx.imageSmoothingEnabled=false;
        ctx.drawImage(img,0,0);
        const dataURL=nc.toDataURL();
        callback(dataURL,nc,ctx);
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleFileImport=(file)=>{
    importImage(file,(dataURL,nc,ctx)=>{

  const handleLineArtImport=(file)=>{
    importImage(file,(dataURL,nc,ctx)=>{
      const nw=nc.width, nh=nc.height;
      const img=ctx.getImageData(0,0,nw,nh),d=img.data;
      const threshold=128;
      for(let i=0;i<d.length;i+=4){
        const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
        if(g>threshold){d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=0;}
        else{d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=255;}
      }
      resizeCanvas(nw,nh);
      requestAnimationFrame(()=>{
        const L=layersRef.current[activeLayerIdx];
        const f=L.frames[L.currentFrame||0];
        f.ctx.clearRect(0,0,nw,nh);
        f.ctx.putImageData(img,0,0);
        commitStroke();
        show('Line art extracted');
      });
    });
  };

  const handleVectorImport=(file)=>{
    importImage(file,(dataURL,nc,ctx)=>{
      const nw=nc.width, nh=nc.height;
      const img=ctx.getImageData(0,0,nw,nh),d=img.data;
      const numColors=8;
      // Simple color quantization + edge detection for vector-like look
      const levels=Math.floor(255/numColors);
      for(let i=0;i<d.length;i+=4){
        if(d[i+3]<128){d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=0;continue;}
        d[i]=Math.round(d[i]/levels)*levels;
        d[i+1]=Math.round(d[i+1]/levels)*levels;
        d[i+2]=Math.round(d[i+2]/levels)*levels;
        d[i+3]=255;
      }
      resizeCanvas(nw,nh);
      requestAnimationFrame(()=>{
        const L=layersRef.current[activeLayerIdx];
        const f=L.frames[L.currentFrame||0];
        f.ctx.clearRect(0,0,nw,nh);
        f.ctx.putImageData(img,0,0);

                    const _hsv=(r,g,b)=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}return[h,mx?d/mx:0,mx];};

        <div className="modal-overlay" onClick={()=>setShowProject(false)}>
          <div className="modal-content" onClick={e=>e.stopPropagation()}>
            <h3 className="text-sm font-bold mb-3">💾 Project</h3>
            <div className="space-y-2">
              <button onClick={()=>{saveProject();setShowProject(false);}} className="w-full text-xs px-3 py-2 bg-neutral-800 hover:bg-neutral-700 rounded-lg border border-neutral-700 text-left">
                Save Project (.pproj)
              </button>
              <label className="block text-xs px-3 py-2 bg-neutral-800 hover:bg-neutral-700 rounded-lg border border-neutral-700 cursor-pointer">
                Load Project (.pproj)
                <input type="file" accept=".pproj,application/octet-stream" className="hidden" onChange={e=>{if(e.target.files[0]){loadProject(e.target.files[0]);setShowProject(false);}}}/>
              </label>
              <div className="border-t border-neutral-700 pt-2 mt-2">
                <span className="text-[10px] text-neutral-500 block mb-1">Canvas Size</span>
                <div className="flex gap-2 items-center">
                  <input type="number" min={8} max={2048} value={w} onChange={e=>setW(+e.target.value||64)} className="godown w-20 text-xs"/>
                  <span className="text-neutral-500">×</span>
                  <input type="number" min={8} max={2048} value={h} onChange={e=>setH(+e.target.value||64)} className="godown w-20 text-xs"/>
                  <button onClick={()=>{
                    // Resize all layers
                    setLayers(layers.map(l=>({...l,frames:l.frames.map(f=>{
                      const nc=document.createElement('canvas');nc.width=w;nc.height=h;
                      nc.getContext('2d').drawImage(f.canvas,0,0);return{...f,canvas:nc,ctx:nc.getContext('2d')};
                    })})));
                    show('Canvas resized');
                  }} className="text-[10px] px-2 py-1 bg-blue-700 rounded hover:bg-blue-600">Resize</button>
                </div>
              </div>
              <div className="border-t border-neutral-700 pt-2 mt-2">
                <span className="text-[10px] text-neutral-500 block mb-1">Tile Size</span>
                <select value={tileSize} onChange={e=>setTileSize(+e.target.value)} className="godown text-xs">
                  {[8,16,24,32,48,64].map(s=><option key={s} value={s}>{s}px</option>)}
                </select>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ─── TOAST ─── */}
      {toast&&<div className="toast">{toast}</div>}
    </div>
    </React.Fragment>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>

<script>
// Pixel Palace <-> Hub bridge
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='EXPORT_CANVAS'){
    // Send a message up requesting that React flatten it (or we flatten it here)
    if(window.__ppGetFlatCanvas) {
        try{ parent.postMessage({type:'CANVAS_DATA',from:'editor',data:window.__ppGetFlatCanvas()},'*'); }catch(err){}
    } else {
        var c=document.querySelector('canvas');
        if(c && c.toDataURL){ try{ parent.postMessage({type:'CANVAS_DATA',from:'editor',data:c.toDataURL()},'*'); }catch(err){} }
    }
  }
  
   if(d.type==='LOAD_CANVAS' && d.data && d.data.editor){
    try{ if(window.__ppLoadCanvas) window.__ppLoadCanvas(d.data.editor); }catch(err){}
  }

  if(d.type==='DOC_SYNC'){
    try{ if(window.__ppSetDoc) window.__ppSetDoc(d.doc); }catch(err){}
  }

  if(d.type==='GET_STATE'){
    try{ var st = window.__ppGetState ? window.__ppGetState() : null; parent.postMessage({type:'EDITOR_STATE', data: st},'*'); }catch(err){ parent.postMessage({type:'EDITOR_STATE', data:null},'*'); }
  }
  if(d.type==='SET_STATE'){
    try{ if(window.__ppSetState) window.__ppSetState(d.data); }catch(err){}
  }
});
</script>

</body>
</html>
