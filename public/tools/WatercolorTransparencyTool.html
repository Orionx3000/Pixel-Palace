<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watercolor Transparency Tool</title>
    <script src="../vendor/tailwind.js"></script>
    <style>
        body { background-color: #161616; color: #e5e7eb; font-family: sans-serif; }
        .canvas-container {
            width: 100%; overflow: auto; border: 2px solid #333; border-radius: 8px;
            background-color: #0a0a0a;
            background-image: linear-gradient(45deg, #2a2a2a 25%, transparent 25%), linear-gradient(-45deg, #2a2a2a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #2a2a2a 75%), linear-gradient(-45deg, transparent 75%, #2a2a2a 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            min-height: 400px;
        }
        canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; }
    </style>
</head>
<body class="p-6 pb-32 max-w-2xl mx-auto">
    <header class="mb-6 text-center">
        <h1 class="text-3xl font-bold text-gray-100">Watercolor Transparency Tool</h1>
        <p class="text-sm text-gray-400 mt-2">Removes white paper backgrounds without destroying light colors.</p>
    </header>

    <div class="bg-neutral-800 p-4 rounded-xl shadow mb-6">
        <label class="block text-sm font-bold text-gray-300 mb-2">1. Upload Scan/Photo</label>
        <input type="file" id="imageLoader" accept="image/*" class="w-full text-sm">
    </div>

    <div class="canvas-container mb-6" id="container">
        <canvas id="canvas"></canvas>
    </div>

    <div class="bg-neutral-800 p-4 rounded-xl shadow mb-6">
        <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-gray-300">2. White Tolerance (Remove Paper)</label>
            <span id="toleranceVal" class="text-sm font-mono text-blue-600 font-bold">40</span>
        </div>
        <input type="range" id="tolerance" min="0" max="150" value="40" class="w-full">
        <p class="text-xs text-gray-400 mt-1">Increase this to remove darker/dirtier paper. Keep it low to preserve light watercolor strokes.</p>
    </div>

    <div class="bg-neutral-800 p-4 rounded-xl shadow mb-6">
        <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-bold text-gray-300">3. Edge Smoothing (Anti-Aliasing)</label>
            <span id="smoothVal" class="text-sm font-mono text-blue-600 font-bold">15</span>
        </div>
        <input type="range" id="smoothing" min="0" max="100" value="15" class="w-full">
        <p class="text-xs text-gray-400 mt-1">Fades the edges of the paint into the transparency so it doesn't look jagged.</p>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-4         bg-neutral-900/90 backdrop-blur-md border-t flex gap-4 z-40 max-w-2xl mx-auto">
        <button id="resetBtn" class="flex-1 bg-neutral-700 text-gray-100 py-3 rounded-xl font-bold">Reset Image</button>
        <button id="downloadBtn" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-200">Download PNG</button>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const toleranceSlider = document.getElementById('tolerance');
        const toleranceVal = document.getElementById('toleranceVal');
        const smoothingSlider = document.getElementById('smoothing');
        const smoothVal = document.getElementById('smoothVal');
        const resetBtn = document.getElementById('resetBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = null;
        let originalPixels = null;

        imageLoader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => { originalImage = img; initCanvas(); };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function initCanvas() {
            if (!originalImage) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
            
            // Limit massive image sizes so the browser doesn't crash, but keep it HD
            const maxDim = 2048;
            let w = originalImage.width;
            let h = originalImage.height;
            if (w > maxDim || h > maxDim) {
                const ratio = Math.min(maxDim / w, maxDim / h);
                w *= ratio;
                h *= ratio;
            }
            
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(originalImage, 0, 0, w, h);
            
            const fullData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            originalPixels = new Uint8ClampedArray(fullData.data);
            processTransparency();
        }

        function processTransparency() {
            if (!originalPixels) return;
            const tolerance = parseInt(toleranceSlider.value);
            const smoothing = parseInt(smoothingSlider.value);
            toleranceVal.textContent = tolerance;
            smoothVal.textContent = smoothing;

            const imageData = ctx.createImageData(canvas.width, canvas.height);
            const data = imageData.data;
            const targetColor = {r: 255, g: 255, b: 255};

            for (let i = 0; i < originalPixels.length; i += 4) {
                const r = originalPixels[i];
                const g = originalPixels[i+1];
                const b = originalPixels[i+2];
                const a = originalPixels[i+3];

                // Distance to pure white
                const dist = Math.sqrt(Math.pow(r - targetColor.r, 2) + Math.pow(g - targetColor.g, 2) + Math.pow(b - targetColor.b, 2));

                data[i] = r; data[i+1] = g; data[i+2] = b;

                if (dist <= tolerance) {
                    data[i+3] = 0; // Pure transparent paper
                } else if (dist > tolerance && dist <= tolerance + smoothing) {
                    const alphaRatio = (dist - tolerance) / smoothing;
                    data[i+3] = Math.floor(a * alphaRatio); // Soft edge
                } else {
                    data[i+3] = a; // Opaque paint
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        toleranceSlider.addEventListener('input', processTransparency);
        smoothingSlider.addEventListener('input', processTransparency);
        resetBtn.addEventListener('click', initCanvas);

        downloadBtn.addEventListener('click', () => {
            if (!originalImage) return;
            const dataURL = canvas.toDataURL('image/png');
            if (parent.window.__tauriSave) {
                parent.window.__tauriSave(dataURL, 'watercolor_art.png', 'png');
            } else {
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = 'watercolor_art.png';
                document.body.appendChild(link);
                link.click();
                setTimeout(() => { document.body.removeChild(link); }, 100);
            }
        });
    </script>

<script>
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='EXPORT_CANVAS'){
    var c=document.querySelector('canvas');
    if(c && c.toDataURL){ try{ parent.postMessage({type:'CANVAS_DATA',from:'tool',data:c.toDataURL()},'*'); }catch(err){} }
  }
});
</script>
</body>
</html>
