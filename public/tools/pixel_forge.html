<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Forge — Photo to Pixel Art</title>
    <script src="../vendor/tailwind.js"></script>
    <style>
        * { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        html,body { touch-action: none; overscroll-behavior: none; -webkit-overflow-scrolling: auto; }
        canvas { image-rendering: pixelated; touch-action: none; }
        .bg-checkered { background-color: #1a1a1a; background-image: linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%,#111),linear-gradient(45deg,#111 25%,transparent 25%,transparent 75%,#111 75%,#111); background-size:20px 20px; background-position:0 0,10px 10px; }
        input[type=range] { accent-color: #22c55e; }
        select { accent-color: #22c55e; }
        @media (max-width:768px) { .sidebar-wrap { order: -1; } }
    </style>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen p-2 md:p-4 font-sans overflow-x-hidden">
<div id="root"></div>
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../vendor/babel.min.js"></script>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const Svg = ({ children, size=20 }) => React.createElement('svg', { xmlns:'http://www.w3.org/2000/svg', width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' }, ...(Array.isArray(children)?children:[children]));
const Pencil = ({size}) => Svg({size, children:React.createElement('path',{d:'M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z'})});
const Eraser = ({size}) => Svg({size, children:[React.createElement('path',{d:'M20 20H7.5l-5.5-5.5L13.5 3 20 9.5 14.5 15'}),React.createElement('line',{x1:2,y1:20,x2:22,y2:20})]});
const Pipette = ({size}) => Svg({size, children:[React.createElement('path',{d:'m2 22 1-1h3l9-9'}),React.createElement('path',{d:'M3 21v-3l9-9'}),React.createElement('circle',{cx:17,cy:7,r:2}),React.createElement('path',{d:'m15 5 2 2-4 4'})]});
const Hand = ({size}) => Svg({size, children:[React.createElement('path',{d:'M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0'}),React.createElement('path',{d:'M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2'}),React.createElement('path',{d:'M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8'}),React.createElement('path',{d:'M18 8a2 2 0 0 1 2 2v6a6 6 0 0 1-6 6h-2a5 5 0 0 1-5-5V14a2 2 0 0 1 2-2'})]});
const ZoomIn = ({size}) => Svg({size, children:[React.createElement('circle',{cx:11,cy:11,r:8}),React.createElement('line',{x1:21,y1:21,x2:16.65,y2:16.65}),React.createElement('line',{x1:11,y1:8,x2:11,y2:14}),React.createElement('line',{x1:8,y1:11,x2:14,y2:11})]});
const ZoomOut = ({size}) => Svg({size, children:[React.createElement('circle',{cx:11,cy:11,r:8}),React.createElement('line',{x1:21,y1:21,x2:16.65,y2:16.65}),React.createElement('line',{x1:8,y1:11,x2:14,y2:11})]});
const Upload = ({size}) => Svg({size, children:[React.createElement('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),React.createElement('polyline',{points:'17 8 12 3 7 8'}),React.createElement('line',{x1:12,y1:3,x2:12,y2:15})]});
const Camera = ({size}) => Svg({size, children:[React.createElement('path',{d:'M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z'}),React.createElement('circle',{cx:12,cy:13,r:3})]});
const X = ({size}) => Svg({size, children:[React.createElement('line',{x1:18,y1:6,x2:6,y2:18}),React.createElement('line',{x1:6,y1:6,x2:18,y2:18})]});
const RefreshCw = ({size}) => Svg({size, children:[React.createElement('polyline',{points:'23 4 23 10 17 10'}),React.createElement('path',{d:'M20.49 15a9 9 0 1 1-2.12-9.36L23 10'})]});
const Settings = ({size}) => Svg({size, children:[React.createElement('circle',{cx:12,cy:12,r:3}),React.createElement('path',{d:'M12 1v2m0 18v2m0-20v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42'})]});
const ImageIcon = ({size}) => Svg({size, children:[React.createElement('rect',{x:3,y:3,width:18,height:18,rx:2,ry:2}),React.createElement('circle',{cx:8.5,cy:8.5,r:1.5}),React.createElement('polyline',{points:'21 15 16 10 5 21'})]});
const Undo = ({size}) => Svg({size, children:[React.createElement('path',{d:'M3 7v6h6'}),React.createElement('path',{d:'M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13'})]});
const Redo = ({size}) => Svg({size, children:[React.createElement('path',{d:'M21 7v6h-6'}),React.createElement('path',{d:'M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13'})]});
const Save = ({size}) => Svg({size, children:[React.createElement('path',{d:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z'}),React.createElement('polyline',{points:'17 21 17 13 7 13 7 21'}),React.createElement('polyline',{points:'7 3 7 8 15 8'})]});
const Download = ({size}) => Svg({size, children:[React.createElement('path',{d:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4'}),React.createElement('polyline',{points:'7 10 12 15 17 10'}),React.createElement('line',{x1:12,y1:15,x2:12,y2:3})]});

const PRESET_RESOLUTIONS = [
    { label: "Tiny Sprite (16px)", value: 16 },
    { label: "Small Sprite (32px)", value: 32 },
    { label: "Medium Sprite (64px)", value: 64 },
    { label: "Large Sprite (128px)", value: 128 },
    { label: "Console BG (256px)", value: 256 },
    { label: "PS1 BG (320px)", value: 320 },
];
const EXPORT_SCALES = [
    { label: "1x (Game Engine Standard)", value: 1 },
    { label: "2x (Upscaled)", value: 2 },
    { label: "4x (Upscaled)", value: 4 },
    { label: "8x (Social Media/Web)", value: 8 },
    { label: "Match Original Image Size", value: 'original' },
];

const rgbToHex = (r,g,b) => '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
const hexToRgb = h => ({r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)});
const colorDistance = (h1, h2) => { const a=hexToRgb(h1),b=hexToRgb(h2); return Math.sqrt((a.r-b.r)**2+(a.g-b.g)**2+(a.b-b.b)**2); };
const adjustColor = (color, amount) => {
    let hex=color.replace('#','');
    if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    let r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
    r=Math.max(0,Math.min(255,r+amount)); g=Math.max(0,Math.min(255,g+amount)); b=Math.max(0,Math.min(255,b+amount));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
};

function App() {
    const [sourceImage, setSourceImage] = useState(null);
    const [cameraActive, setCameraActive] = useState(false);
    const [targetWidth, setTargetWidth] = useState(64);
    const [colorLevels, setColorLevels] = useState(16);
    const [exportScale, setExportScale] = useState(1);
    const [isProcessing, setIsProcessing] = useState(false);

    const [palette, setPalette] = useState([]);
    const [selectedColor, setSelectedColor] = useState('#ffffff');
    const [tool, setTool] = useState('pencil');
    const [zoom, setZoom] = useState(100);
    const [isDrawing, setIsDrawing] = useState(false);

    const [isPanning, setIsPanning] = useState(false);
    const [panStart, setPanStart] = useState({x:0,y:0});
    const [scrollStart, setScrollStart] = useState({left:0,top:0});

    const [undoStack, setUndoStack] = useState([]);
    const [redoStack, setRedoStack] = useState([]);

    const [showSaveModal, setShowSaveModal] = useState(false);
    const [saveFileName, setSaveFileName] = useState('pixel_art');

    const videoRef = useRef(null);
    const editorCanvasRef = useRef(null);
    const viewportRef = useRef(null);
    const fileInputRef = useRef(null);
    const streamRef = useRef(null);

    const stopCamera = useCallback(() => {
        if (streamRef.current) { streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; }
        setCameraActive(false);
    }, []);

    useEffect(() => () => stopCamera(), [stopCamera]);

    const handleFileUpload = e => {
        const file = e.target && e.target.files ? e.target.files[0] : null;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const img = new Image();
                img.onload = () => {
                    try {
                        const MAXD = 4096;
                        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
                        if (w > MAXD || h > MAXD) {
                            const sc = MAXD / Math.max(w, h);
                            const c = document.createElement('canvas');
                            c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
                            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                            setSourceImage(c);
                        } else {
                            setSourceImage(img);
                        }
                        stopCamera();
                    } catch (err) { alert('Could not load image: ' + err.message); }
                };
                img.onerror = () => alert('Image failed to decode.');
                img.src = ev.target.result;
            } catch (err) { alert('Upload error: ' + err.message); }
        };
        reader.onerror = () => alert('Could not read file.');
        reader.readAsDataURL(file);
    };

    const startCamera = async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
            streamRef.current = stream;
            if (videoRef.current) videoRef.current.srcObject = stream;
            setCameraActive(true); setSourceImage(null);
        } catch(e) { alert("Could not access camera."); }
    };

    const capturePhoto = () => {
        if (!videoRef.current) return;
        const v = videoRef.current;
        const c = document.createElement('canvas');
        c.width=v.videoWidth; c.height=v.videoHeight;
        c.getContext('2d').drawImage(v,0,0,c.width,c.height);
        const img = new Image();
        img.onload = () => { setSourceImage(img); stopCamera(); };
        img.src = c.toDataURL('image/png');
    };

    const processImage = useCallback(() => {
        if (!sourceImage || !editorCanvasRef.current) return;
        setIsProcessing(true);
        setTimeout(() => {
         try {
            const W = sourceImage.width || sourceImage.naturalWidth;
            const H = sourceImage.height || sourceImage.naturalHeight;
            if (!W || !H) { setIsProcessing(false); return; }
            const aspect = H / W;
            const targetH = Math.max(1, Math.round(targetWidth * aspect));
            const cvs = editorCanvasRef.current;
            cvs.width = targetWidth; cvs.height = targetH;
            const ctx = cvs.getContext('2d', {willReadFrequently:true});
            ctx.drawImage(sourceImage, 0, 0, targetWidth, targetH);
            const colorCounts = new Map();
            if (colorLevels < 256) {
                const d = ctx.getImageData(0,0,targetWidth,targetH); const s=d.data;
                const f=255/(colorLevels-1);
                for(let i=0;i<s.length;i+=4) {
                    s[i]=Math.round(s[i]/f)*f; s[i+1]=Math.round(s[i+1]/f)*f; s[i+2]=Math.round(s[i+2]/f)*f; s[i+3]=s[i+3]>127?255:0;
                    if(s[i+3]>0) colorCounts.set(rgbToHex(s[i],s[i+1],s[i+2]),(colorCounts.get(rgbToHex(s[i],s[i+1],s[i+2]))||0)+1);
                }
                ctx.putImageData(d,0,0);
            } else {
                const d = ctx.getImageData(0,0,targetWidth,targetH); const s=d.data;
                for(let i=0;i<s.length;i+=4) { if(s[i+3]>0) colorCounts.set(rgbToHex(s[i],s[i+1],s[i+2]),(colorCounts.get(rgbToHex(s[i],s[i+1],s[i+2]))||0)+1); }
            }
            const sorted = Array.from(colorCounts.entries()).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
            const extracted = [];
            for (const h of sorted) {
                if (extracted.length>=64) break;
                let tooClose=false;
                for (const ex of extracted) { if (colorDistance(h,ex)<20) { tooClose=true; break; } }
                if (!tooClose) extracted.push(h);
            }
            if (extracted.length<16) { for (const h of sorted) { if (extracted.length>=64) break; if(!extracted.includes(h)) extracted.push(h); } }
            setPalette(extracted);
            if (extracted.length>0) setSelectedColor(extracted[0]);
            setUndoStack([]); setRedoStack([]);
            setIsProcessing(false);
         } catch(err) { setIsProcessing(false); alert('Process error: '+err.message); }
        }, 10);
    }, [sourceImage, targetWidth, colorLevels]);

    useEffect(() => { processImage(); }, [processImage]);

    const getPointerCoords = e => {
        const cvs = editorCanvasRef.current; if (!cvs) return null;
        const r = cvs.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return {x:Math.floor((cx-r.left)*(cvs.width/r.width)), y:Math.floor((cy-r.top)*(cvs.height/r.height))};
    };

    const drawPixel = e => {
        if (!isDrawing || !editorCanvasRef.current) return;
        const p = getPointerCoords(e); if (!p) return;
        const ctx = editorCanvasRef.current.getContext('2d',{willReadFrequently:true});
        if (tool==='eraser') ctx.clearRect(p.x,p.y,1,1);
        else { ctx.fillStyle=selectedColor; ctx.fillRect(p.x,p.y,1,1); }
    };

    const saveState = useCallback(() => {
        const c = editorCanvasRef.current; if (!c) return;
        setUndoStack(p=>[...p.slice(-49),c.getContext('2d').getImageData(0,0,c.width,c.height)]);
        setRedoStack([]);
    }, []);

    const handleUndo = () => {
        if (undoStack.length===0) return;
        const c = editorCanvasRef.current; const ctx=c.getContext('2d');
        const cur = ctx.getImageData(0,0,c.width,c.height);
        const prev = undoStack[undoStack.length-1];
        setUndoStack(p=>p.slice(0,-1)); setRedoStack(p=>[...p,cur]);
        ctx.putImageData(prev,0,0);
    };

    const handleRedo = () => {
        if (redoStack.length===0) return;
        const c = editorCanvasRef.current; const ctx=c.getContext('2d');
        const cur = ctx.getImageData(0,0,c.width,c.height);
        const next = redoStack[redoStack.length-1];
        setRedoStack(p=>p.slice(0,-1)); setUndoStack(p=>[...p,cur]);
        ctx.putImageData(next,0,0);
    };

    const pickColor = e => {
        const p = getPointerCoords(e); if (!p) return;
        const ctx = editorCanvasRef.current.getContext('2d',{willReadFrequently:true});
        const px = ctx.getImageData(p.x,p.y,1,1).data;
        if (px[3]>0) setSelectedColor(rgbToHex(px[0],px[1],px[2]));
        setTool('pencil');
    };

    const handlePointerDown = e => {
        if (e.touches) e.preventDefault();
        if (tool==='move') {
            const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
            setIsPanning(true); setPanStart({x:cx,y:cy});
            if (viewportRef.current) setScrollStart({left:viewportRef.current.scrollLeft,top:viewportRef.current.scrollTop});
            return;
        }
        if (tool==='eyedropper') { pickColor(e); return; }
        saveState(); setIsDrawing(true); drawPixel(e);
    };
    const handlePointerUp = (e) => { if (e && e.touches) e.preventDefault(); setIsDrawing(false); setIsPanning(false); };
    const handlePointerMove = e => {
        if (e.touches) e.preventDefault();
        if (isPanning&&tool==='move'&&viewportRef.current) {
            const cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
            viewportRef.current.scrollLeft=scrollStart.left-(cx-panStart.x);
            viewportRef.current.scrollTop=scrollStart.top-(cy-panStart.y);
            return;
        }
        if (isDrawing&&tool!=='eyedropper'&&tool!=='move') drawPixel(e);
    };

    const handleConfirmSaveAs = async () => {
        const c = editorCanvasRef.current; if (!c) return;
        let scale = exportScale==='original'&&sourceImage ? Math.max(1,Math.round(sourceImage.width/targetWidth)) : Number(exportScale);
        const ec = document.createElement('canvas');
        ec.width=c.width*scale; ec.height=c.height*scale;
        const ectx = ec.getContext('2d'); ectx.imageSmoothingEnabled=false;
        ectx.drawImage(c,0,0,ec.width,ec.height);
        const fn = saveFileName+'.png';
        try {
            const blob = await new Promise(r=>ec.toBlob(r,'image/png'));
            if (!blob) throw new Error('fail');
            if (navigator.canShare) { const f=new File([blob],fn,{type:'image/png'}); if (navigator.canShare({files:[f]})) { await navigator.share({files:[f],title:fn}); setShowSaveModal(false); return; } }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href=url; a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            setTimeout(()=>URL.revokeObjectURL(url),100); setShowSaveModal(false);
        } catch(e) { alert('Save failed.'); }
    };

    return (
        <div className="min-h-screen bg-neutral-900 text-neutral-100 p-4 font-sans flex flex-col select-none">
            <header className="text-center mb-4">
                <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600 flex items-center justify-center gap-3">
                    <ImageIcon size={28} /> Pixel Forge
                </h1>
                <p className="text-neutral-500 text-sm mt-1">Photo → pixel art converter</p>
            </header>

            <div className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 max-w-7xl mx-auto w-full">

                {/* Main Editor */}
                <div className="lg:col-span-8 flex flex-col gap-4">
                    {sourceImage && (
                        <div className="bg-neutral-800 border border-neutral-700 p-3 rounded-xl shadow-lg flex flex-col gap-3">
                            <div className="flex flex-wrap gap-4 items-center justify-between">
                                <div className="flex gap-2 bg-neutral-900 p-1 rounded-lg">
                                    {[{t:'pencil',icon:()=><Pencil size={20}/>,title:'Pencil'},{t:'eraser',icon:()=><Eraser size={20}/>,title:'Eraser'},{t:'eyedropper',icon:()=><Pipette size={20}/>,title:'Color Picker'},{t:'move',icon:()=><Hand size={20}/>,title:'Pan'}].map(({t,icon,title}) =>
                                        <button key={t} onClick={()=>setTool(t)} className={`p-2 rounded-md transition-colors ${tool===t?t==='eyedropper'?'bg-blue-500 text-white':t==='move'?'bg-orange-500 text-white':'bg-green-500 text-white':'text-neutral-400 hover:text-white'}`} title={title}>{icon()}</button>
                                    )}
                                </div>
                                <div className="flex gap-2 items-center">
                                    <button onClick={handleUndo} disabled={undoStack.length===0} className="p-2 text-neutral-400 hover:text-white disabled:opacity-30" title="Undo"><Undo size={20}/></button>
                                    <button onClick={handleRedo} disabled={redoStack.length===0} className="p-2 text-neutral-400 hover:text-white disabled:opacity-30" title="Redo"><Redo size={20}/></button>
                                </div>
                                <div className="flex gap-2 items-center bg-neutral-900 p-1 rounded-lg">
                                    <button onClick={()=>setZoom(Math.max(25,zoom-25))} className="p-2 text-neutral-400 hover:text-white"><ZoomOut size={20}/></button>
                                    <span className="text-xs font-mono w-12 text-center">{zoom}%</span>
                                    <button onClick={()=>setZoom(Math.min(1000,zoom+25))} className="p-2 text-neutral-400 hover:text-white"><ZoomIn size={20}/></button>
                                </div>
                            </div>
                            <div className="flex flex-wrap md:flex-nowrap gap-4 items-center bg-neutral-900 p-2 rounded-lg">
                                <div className="flex items-center gap-3 border-r border-neutral-700 pr-4">
                                    <div className="w-10 h-10 rounded border-2 border-neutral-500 shadow-inner flex items-center justify-center relative overflow-hidden shrink-0" style={{backgroundColor:selectedColor}} title="Current Color">
                                        <input type="color" value={selectedColor} onChange={e=>{setSelectedColor(e.target.value);setTool('pencil');}} className="absolute inset-0 w-12 h-12 -m-1 opacity-0 cursor-pointer" />
                                    </div>
                                    <div className="flex flex-col gap-1">
                                        <button onClick={()=>setSelectedColor(adjustColor(selectedColor,20))} className="text-[10px] px-2 py-0.5 bg-neutral-700 hover:bg-neutral-500 text-neutral-200 rounded font-medium">+ Lighter</button>
                                        <button onClick={()=>setSelectedColor(adjustColor(selectedColor,-20))} className="text-[10px] px-2 py-0.5 bg-neutral-700 hover:bg-neutral-500 text-neutral-200 rounded font-medium">- Darker</button>
                                    </div>
                                </div>
                                <div className="flex-1 flex flex-wrap gap-1 max-h-24 overflow-y-auto pl-2 pr-2">
                                    {palette.map((c,i) =>
                                        <button key={i} onClick={()=>{setSelectedColor(c);setTool('pencil');}} className={`w-6 h-6 rounded-full border-2 transition-transform hover:scale-110 shrink-0 ${selectedColor===c?'border-white scale-110':'border-transparent'}`} style={{backgroundColor:c}} title={c} />
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Canvas */}
                    <div className="bg-neutral-800 border border-neutral-700 rounded-2xl overflow-hidden flex-1 min-h-[50vh] relative shadow-xl flex items-center justify-center bg-checkered">
                        {!sourceImage && !cameraActive && (
                            <div className="text-center space-y-4 p-8 absolute inset-0 flex flex-col items-center justify-center">
                                <div className="flex gap-4">
                                    <button onClick={()=>fileInputRef.current?.click()} className="flex flex-col items-center gap-2 p-6 bg-neutral-700 hover:bg-neutral-600 rounded-xl transition-all shadow-lg">
                                        <Upload size={32} className="text-green-400" /> <span>Upload Image</span>
                                    </button>
                                    <button onClick={startCamera} className="flex flex-col items-center gap-2 p-6 bg-neutral-700 hover:bg-neutral-600 rounded-xl transition-all shadow-lg">
                                        <Camera size={32} className="text-blue-400" /> <span>Open Camera</span>
                                    </button>
                                </div>
                                <input type="file" accept="image/*" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                            </div>
                        )}
                        {cameraActive && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black">
                                <video ref={videoRef} autoPlay playsInline className="w-full h-full object-contain" />
                                <div className="absolute bottom-6 flex gap-4">
                                    <button onClick={capturePhoto} className="px-6 py-3 bg-white text-black font-bold rounded-full shadow-xl">Capture</button>
                                    <button onClick={stopCamera} className="p-3 bg-neutral-800 text-white rounded-full shadow-xl"><X size={24}/></button>
                                </div>
                            </div>
                        )}
                        <div ref={viewportRef} className={`w-full h-full overflow-auto flex items-start justify-start p-10 relative ${!sourceImage?'hidden':''}`}>
                            <div className="relative mx-auto my-auto">
                                <canvas ref={editorCanvasRef} style={{width:`${512*(zoom/100)}px`,imageRendering:'pixelated',touchAction:'none'}} className={`shadow-2xl bg-transparent ${isProcessing?'opacity-50':'opacity-100'} ${tool==='move'?(isPanning?'cursor-grabbing':'cursor-grab'):tool==='eraser'?'cursor-cell':'cursor-crosshair'}`}
                                    onMouseDown={handlePointerDown} onMouseMove={handlePointerMove} onMouseUp={handlePointerUp} onMouseLeave={handlePointerUp}
                                    onTouchStart={handlePointerDown} onTouchMove={handlePointerMove} onTouchEnd={handlePointerUp}
                                    onContextMenu={e=>e.preventDefault()} />
                            </div>
                        </div>
                        {sourceImage && (
                            <button onClick={()=>setSourceImage(null)} className="absolute top-4 right-4 p-2 bg-neutral-900/80 hover:bg-red-500/80 text-white rounded-lg shadow-lg"><X size={20}/></button>
                        )}
                        {isProcessing && (
                            <div className="absolute inset-0 flex items-center justify-center bg-black/60 z-10"><RefreshCw className="animate-spin text-green-400" size={40}/></div>
                        )}
                    </div>
                </div>

                {/* Sidebar */}
                <div className="lg:col-span-4 space-y-4 bg-neutral-800 border border-neutral-700 p-5 rounded-2xl shadow-xl h-fit sidebar-wrap">
                    <div className="flex items-center gap-2 border-b border-neutral-700 pb-3">
                        <Settings size={18} className="text-neutral-400" />
                        <h2 className="text-lg font-bold">Import Settings</h2>
                    </div>

                    <div className="space-y-1">
                        <label className="text-xs font-medium text-neutral-400 uppercase">Target Resolution</label>
                        <select value={targetWidth} onChange={e=>setTargetWidth(Number(e.target.value))} className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-2.5 text-sm text-white outline-none focus:border-green-500">
                            {PRESET_RESOLUTIONS.map(r=><option key={r.value} value={r.value}>{r.label}</option>)}
                        </select>
                    </div>

                    <div className="space-y-1">
                        <div className="flex justify-between items-center">
                            <label className="text-xs font-medium text-neutral-400 uppercase">Colors</label>
                            <span className="text-xs">{colorLevels===256?'True Color':colorLevels+' Levels'}</span>
                        </div>
                        <input type="range" min="2" max="64" step="2" value={colorLevels<256?colorLevels:64} onChange={e=>setColorLevels(Number(e.target.value))} className="w-full" />
                        <button onClick={()=>setColorLevels(256)} className="text-xs text-green-400 hover:text-green-300 w-full text-right">Set to True Color</button>
                    </div>

                    <div className="pt-4 border-t border-neutral-700 space-y-4">
                        <div className="space-y-1">
                            <label className="text-xs font-medium text-neutral-400 uppercase">Export Scale</label>
                            <select value={exportScale} onChange={e=>setExportScale(e.target.value)} className="w-full bg-neutral-900 border border-neutral-700 rounded-lg p-2.5 text-sm text-white outline-none focus:border-blue-500">
                                {EXPORT_SCALES.map(s=><option key={s.value} value={s.value}>{s.label}</option>)}
                            </select>
                        </div>
                        <button onClick={()=>{setSaveFileName('sprite_'+targetWidth+'px');setShowSaveModal(true);}} disabled={!sourceImage}
                            className={`w-full flex items-center justify-center gap-2 py-3 rounded-xl font-bold transition-all shadow-lg ${sourceImage?'bg-gradient-to-r from-blue-500 to-indigo-600 hover:opacity-90 text-white':'bg-neutral-800 text-neutral-500 border border-neutral-700'}`}>
                            <Save size={18}/> Save As...
                        </button>
                    </div>
                </div>
            </div>

            {showSaveModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm">
                    <div className="bg-neutral-800 border border-neutral-600 p-6 rounded-2xl w-full max-w-sm space-y-5 shadow-2xl">
                        <h3 className="text-xl font-bold text-white flex gap-2"><Download /> Save As</h3>
                        <div className="space-y-2">
                            <label className="text-sm text-neutral-400 block">File Name</label>
                            <div className="flex bg-neutral-900 border border-neutral-700 rounded-lg overflow-hidden focus-within:border-blue-500">
                                <input type="text" value={saveFileName} onChange={e=>setSaveFileName(e.target.value)} className="w-full bg-transparent p-3 text-white outline-none" autoFocus />
                                <div className="bg-neutral-800 px-3 flex items-center text-neutral-500 text-sm font-mono border-l border-neutral-700">.png</div>
                            </div>
                        </div>
                        <div className="flex gap-3 pt-2">
                            <button onClick={()=>setShowSaveModal(false)} className="flex-1 py-3 bg-neutral-700 hover:bg-neutral-600 rounded-xl font-bold text-white">Cancel</button>
                            <button onClick={handleConfirmSaveAs} className="flex-1 py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-white shadow-lg shadow-blue-900/50">Confirm Save</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

<script>
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='EXPORT_CANVAS'){
    var c=document.querySelector('canvas');
    if(c && c.toDataURL){ try{ parent.postMessage({type:'CANVAS_DATA',from:'tool',data:c.toDataURL()},'*'); }catch(err){} }
  }
});
</script>
</body>
</html>
